name: ClaimCore frontend product

on:
  workflow_call:

permissions:
  contents: read

jobs:
  product:
    name: Locked frontend product and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Restore the locked source tree
        run: dotnet restore ClaimCore.slnx --locked-mode
      - name: Produce the contracts, the frontend and its SBOM from the locked graphs
        run: node eng/ci/run-stages.mjs frontend-product --parallel 2
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: |
          node eng/ci/scan/main.mjs artifacts \
            artifacts/frontend-product/ \
            artifacts/frontend-contracts/ \
            artifacts/sbom/
      - name: Upload immutable frontend product
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend-product/
          if-no-files-found: error
          retention-days: 14
      - name: Upload the generated contract artifacts
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend-contracts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload required frontend SBOM
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-frontend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sbom/
          if-no-files-found: error
          retention-days: 14
