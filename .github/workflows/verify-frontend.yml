name: ClaimCore frontend gate verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Locked frontend gates and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Restore the locked source tree and install the locked npm graph
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          npm --prefix web ci
      - name: Generate the contract artifacts and verify them against the lock
        run: npm --prefix web run contract:generate
      - name: Run every registered frontend and npm gate concurrently
        run: node eng/ci/run-stages.mjs frontend --parallel 4
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: |
          node eng/ci/scan/main.mjs artifacts \
            artifacts/frontend/
      - name: Upload required frontend results
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-frontend-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend/
          if-no-files-found: error
          retention-days: 14
