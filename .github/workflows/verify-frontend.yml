name: ClaimCore frontend verification

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NO_COLOR: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  frontend:
    name: Locked frontend producer and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Require the exact Node and npm toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v$(tr -d '\r\n' < .node-version)"
          test "$(npm --version)" = "$(node -p "require('./web/package.json').engines.npm")"
      - name: Build the evidence executable
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet build eng/ClaimCore.Docs/ClaimCore.Docs.fsproj --configuration Release --no-restore
      - name: Restore the pinned formatter for generated .NET protocol sources
        run: dotnet tool restore
      - name: Run every registered frontend and npm gate
        shell: bash
        run: |
          set -u
          docs=artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll
          overall=0
          run_stage() {
            stage="$1"
            output="$2"
            shift 2
            test ! -e "$output" || return 1
            mkdir -p "$output"
            log="$RUNNER_TEMP/claimcore-$stage.log"
            started="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
            if "$@" >"$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            finished="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
            outcome=failure
            if [[ "$status" -eq 0 ]]; then outcome=success; fi
            printf 'Stage %s: %s.\n' "$stage" "$outcome"
            if dotnet "$docs" stage-manifest "$stage" "${{ github.run_id }}" "${{ github.run_attempt }}" "$outcome" "$started" "$finished" "$output"; then
              manifest_status=0
            else
              manifest_status=$?
            fi
            if [[ "$status" -ne 0 || "$manifest_status" -ne 0 ]]; then overall=1; fi
          }
          run_stage restore-frontend artifacts/stages/restore-frontend npm --prefix web ci
          run_stage dependency-currency artifacts/stages/dependency-currency pwsh -File eng/Check-DependencyCurrency.ps1
          run_stage frontend-format artifacts/stages/frontend-format npm --prefix web run format:check
          run_stage frontend-types artifacts/stages/frontend-types npm --prefix web run typecheck
          run_stage frontend-eslint artifacts/stages/frontend-eslint npm --prefix web run lint
          run_stage frontend-stylelint artifacts/stages/frontend-stylelint npm --prefix web run lint:styles
          run_stage frontend-dead-code artifacts/stages/frontend-dead-code npm --prefix web run dead-code
          run_stage frontend-contract-inventory artifacts/stages/frontend-contract-inventory npm --prefix web run contract:check
          run_stage npm-audit artifacts/stages/npm-audit npm --prefix web audit --audit-level=low
          run_stage npm-signatures artifacts/stages/npm-signatures npm --prefix web audit signatures
          run_stage dependency-licenses artifacts/stages/dependency-licenses npm --prefix web run licenses:check
          run_stage sbom artifacts/sbom npm --prefix web run sbom
          run_stage frontend-unit artifacts/frontend npm --prefix web run test:unit
          run_stage frontend-build artifacts/frontend-product bash -c 'npm --prefix web run build && mkdir -p artifacts/frontend-product/dist && cp -R web/dist/. artifacts/frontend-product/dist/'
          exit "$overall"
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File eng/Scan-ArtifactSecrets.ps1 `
            artifacts/frontend-product/ `
            artifacts/frontend/ `
            artifacts/sbom/ `
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/"
      - name: Upload immutable frontend product
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend-product/
          if-no-files-found: error
          retention-days: 14
      - name: Upload required frontend results
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-frontend-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend/
          if-no-files-found: error
          retention-days: 14
      - name: Upload required frontend SBOM
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-frontend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sbom/
          if-no-files-found: error
          retention-days: 14
      - name: Upload frontend stage evidence
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-stage-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/*.json
          if-no-files-found: error
          retention-days: 14
