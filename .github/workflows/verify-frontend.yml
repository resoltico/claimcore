name: ClaimCore frontend gate verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Locked frontend gates and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - name: Admit the explicit job checkout
        shell: bash
        run: node eng/ci/job-context.mjs create >> "$GITHUB_ENV"
      - name: Restore the locked source tree and install the locked npm graph
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          npm --prefix web ci
      - name: Generate the contract artifacts and verify them against the lock
        run: npm --prefix web run contract:generate
      - name: Run every registered frontend and npm gate concurrently
        run: node eng/ci/run-stages.mjs frontend --parallel 4
      - name: Retain the produced mutation report with the frontend evidence
        id: mutation_evidence
        if: always()
        shell: bash
        run: |
          for path in web web/artifacts web/artifacts/stryker artifacts artifacts/frontend; do
            test ! -L "$path"
            if test -e "$path"; then test -d "$path"; fi
          done
          for path in web/artifacts/stryker/domain-mutation.json artifacts/frontend/domain-mutation.json; do
            test ! -L "$path"
          done
          test ! -e artifacts/frontend/domain-mutation.json
          if test -e web/artifacts/stryker/domain-mutation.json; then
            test -f web/artifacts/stryker/domain-mutation.json
            mkdir -p artifacts/frontend
            cp web/artifacts/stryker/domain-mutation.json artifacts/frontend/domain-mutation.json
          fi
      - name: Recheck admitted job inputs before evidence scanning
        id: job_checkout_current
        if: always()
        run: node eng/ci/job-context.mjs check
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: |
          node eng/ci/scan/main.mjs artifacts \
            artifacts/frontend/
      - name: Upload required frontend results
        if: ${{ always() && steps.artifact_scan.outcome == 'success' && steps.job_checkout_current.outcome == 'success' && steps.mutation_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-frontend-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend/
          if-no-files-found: error
          retention-days: 14
