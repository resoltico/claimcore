name: Temporary transport diagnostics reproduction
on:
  push:
    branches: [feat/transport-host-admin-diagnostics]
    paths: [.github/workflows/transport-diagnostics-workspace.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dd9fa2f6228f8625d74ce14ea00827a8a4c350b3
          persist-credentials: false
      - name: Apply the checksum-verified source delta to the exact baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          if subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() != '910a0169f16b1a1d2ee1d9264d21c73d25194f39':
              raise SystemExit('Unexpected baseline tree.')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          chunks = []
          for sha in ['6a58623a3281b6b760356366429f51572cbb0472', '2a42200ae822f9c58b5aff5f15dfc9351a8557bd', 'a12e45b255ad7bdbf53df26854c1f50b5a575185', '6b830cdd109bc04bb74374b210d238a8ca197d5d', 'bfc6d87709859cfe3923bfa32d26c78f252ec222']:
              url = 'https://api.github.com/repos/resoltico/claimcore/git/blobs/' + sha
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                  blob = json.load(response)
              if blob['sha'] != sha or blob['encoding'] != 'base64':
                  raise SystemExit('Unexpected source-delta object.')
              chunks.append(base64.b64decode(blob['content']))
          patch = lzma.decompress(b''.join(chunks))
          if hashlib.sha256(patch).hexdigest() != '4535abaafe31e8a8a4a565266d28ca4d08a93917a2f79f698b4a9bdf4fd2e6a2':
              raise SystemExit('Source-delta checksum mismatch.')
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '-'], input=patch, check=True)
          print('Reviewed source delta applied to the exact merged baseline.')
          PY
      - uses: ./.github/actions/toolchain
      - name: Restore pinned generator dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore eng/ClaimCore.ContractGenerator/ClaimCore.ContractGenerator.fsproj --locked-mode
          npm ci --prefix web --ignore-scripts
      - name: Regenerate contracts and verify the complete candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web run contract:generate
          git add -A
          actual="$(git write-tree)"
          printf 'Reproduced source tree: %s\n' "$actual"
          test "$actual" = '22f04695f91e11a01a068853f13d50c71c08edca'
          test "$(git ls-files | wc -l | tr -d ' ')" = '817'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '198'
      - name: Store verified source objects without updating branches or tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          if git('write-tree').decode().strip() != '22f04695f91e11a01a068853f13d50c71c08edca':
              raise SystemExit('Candidate changed after reproduction.')
          changed = set(git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0'))
          entries = []
          for record in git('ls-files', '--stage', '-z').decode().strip('\0').split('\0'):
              metadata, path = record.split('\t', 1)
              if path not in changed or path.startswith('.github/workflows/'):
                  continue
              mode, sha, stage = metadata.split()
              if stage != '0' or mode not in ('100644', '100755'):
                  raise SystemExit('Unexpected staged file mode.')
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': git('cat-file', 'blob', sha).decode('utf-8')})
          if len(entries) != 195:
              raise SystemExit('Unexpected reviewed source-file count.')
          payload = json.dumps({'base_tree': '910a0169f16b1a1d2ee1d9264d21c73d25194f39', 'tree': entries}).encode('utf-8')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          url = 'https://api.github.com/repos/resoltico/claimcore/git/trees'
          with urllib.request.urlopen(urllib.request.Request(url, data=payload, headers=headers, method='POST'), timeout=120) as response:
              result = json.load(response)
          if result['sha'] != 'd2c8e26750651b41dad4b60b1d18ab58107e84a9':
              raise SystemExit('Stored source tree differs from the reviewed candidate.')
          print('Verified source tree: ' + result['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Exact candidate reproduced: `22f04695f91e11a01a068853f13d50c71c08edca`. Workflow publication remains with the authorized repository connector. No branch or tag was updated by this job.\n')
          PY
