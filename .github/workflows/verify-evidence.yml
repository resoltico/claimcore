name: ClaimCore evidence reconciliation

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NO_COLOR: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  evidence:
    name: Reconcile every current-attempt producer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Collect all current-attempt stage manifests
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claimcore-stage-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages
          merge-multiple: true
      - name: Collect Linux unit TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-unit-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/unit-linux
      - name: Collect macOS unit TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-unit-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/unit-macos
      - name: Collect Windows unit TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-unit-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/unit-windows
      - name: Collect Linux fuzz TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-fuzz-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/fuzz-linux
      - name: Collect macOS fuzz TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-fuzz-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/fuzz-macos
      - name: Collect Windows fuzz TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-fuzz-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/fuzz-windows
      - name: Collect Linux architecture TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-architecture-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/architecture-linux
      - name: Collect macOS architecture TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-architecture-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/architecture-macos
      - name: Collect Windows architecture TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-architecture-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/architecture-windows
      - name: Collect Linux Web TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-web-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/web-linux
      - name: Collect macOS Web TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-web-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/web-macos
      - name: Collect Windows Web TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-web-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/web-windows
      - name: Collect Linux documentation TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-docs-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/docs-linux
      - name: Collect macOS documentation TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-docs-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/docs-macos
      - name: Collect Windows documentation TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-docs-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/docs-windows
      - name: Collect PostgreSQL integration TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-integration-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/integration-linux
      - name: Collect independent qualification TRX reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-qualifications-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs
      - name: Collect published CLI acceptance TRX
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-acceptance-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-inputs/acceptance-linux
      - name: Collect frontend execution evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-frontend-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend
      - name: Collect immutable frontend product for secret scanning
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assurance-inputs/frontend-product
      - name: Collect frontend SBOM for secret scanning
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-frontend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assurance-inputs/frontend-sbom
      - name: Collect published applications for secret scanning
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assurance-inputs/published
      - name: Collect browser execution evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claimcore-browser-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser
          merge-multiple: true
      - name: Collect coverage artifacts for secret scanning
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assurance-inputs/coverage
      - name: Collect the retained PostgreSQL container SBOM
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-container-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/assurance-inputs/container-sbom
      - name: Build the reconciler
        id: build_reconciler
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet build eng/ClaimCore.Docs/ClaimCore.Docs.fsproj --configuration Release --no-restore
      # The scanner otherwise fetches its own binary at scan time, so a transient network failure
      # is reported exactly like a refused artifact. Fetching it once, with its reviewed checksum,
      # keeps the gate fail-closed on content rather than on connectivity.
      - name: Fetch the checksum-verified artifact scanner
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/claimcore-evidence-scanner"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tools/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tools/gitleaks.tar.gz" | sha256sum --check
          echo "CLAIMCORE_SCANNER_ARCHIVE=$tools/gitleaks.tar.gz" >> "$GITHUB_ENV"
      - name: Scan all collected artifacts without emitting matches
        id: artifact_secrets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/stages/secret-scan-artifacts
          test ! -e "$output"
          started="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
          status=0
          pwsh -NoProfile -File eng/Scan-ArtifactSecrets.ps1 \
            artifacts/evidence-inputs \
            artifacts/frontend \
            artifacts/browser \
            artifacts/assurance-inputs/coverage \
            artifacts/assurance-inputs/container-sbom \
            artifacts/assurance-inputs/frontend-product \
            artifacts/assurance-inputs/frontend-sbom \
            artifacts/assurance-inputs/published \
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages" || status=1
          finished="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
          mkdir -p "$output"
          outcome=failure
          if [[ "$status" -eq 0 ]]; then outcome=success; fi
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll stage-manifest \
            secret-scan-artifacts "${{ github.run_id }}" "${{ github.run_attempt }}" "$outcome" \
            "$started" "$finished" "$output"
          exit "$status"
      - name: Reconcile stage and execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docs=artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll
          report="artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/evidence.json"
          if [[ -f "$docs" ]]; then
            if [[ -d artifacts/evidence-inputs ]]; then
              started="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
              dotnet "$docs" stage-manifest evidence-inputs \
                "${{ github.run_id }}" "${{ github.run_attempt }}" success \
                "$started" "$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)" \
                artifacts/evidence-inputs || true
            fi
            dotnet "$docs" evidence "${{ github.run_id }}" "${{ github.run_attempt }}"
          else
            mkdir -p "$(dirname "$report")"
            jq --null-input \
              --arg runId "${{ github.run_id }}" \
              --argjson attempt "${{ github.run_attempt }}" \
              '{
                schemaVersion: 1,
                runId: $runId,
                attempt: $attempt,
                outcome: "failed",
                source: {contentSha256: null, locksSha256: null, state: "unavailable"},
                assurance: {
                  synchronized: "not-complete",
                  behaviorExercised: "not-complete",
                  semanticReview: "not-assessed",
                  semanticReviewerKinds: [],
                  notRun: ["reconciler-build"]
                },
                stages: [],
                reports: [],
                contractEvidence: [],
                errors: ["Evidence executable was unavailable."]
              }' > "$report"
            exit 1
          fi
      - name: Scan reconciled evidence before upload
        id: artifact_scan
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File eng/Scan-ArtifactSecrets.ps1 `
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/evidence.json"
      - name: Upload the required evidence report
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/evidence.json
          if-no-files-found: error
          retention-days: 30
