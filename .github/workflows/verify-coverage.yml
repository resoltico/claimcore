name: ClaimCore coverage verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    name: Merged production coverage policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Download Linux unit coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-unit-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage-input/unit
      - name: Download Linux Web coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-web-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage-input/web
      - name: Download PostgreSQL integration coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-test-postgres-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage-input/postgres
      - name: Download published browser host coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claimcore-browser-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage-input/browser
          merge-multiple: true
      - name: Restore the pinned report tool
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet tool restore
      - name: Merge and enforce repository coverage floors
        run: node eng/ci/coverage/merge.mjs artifacts/coverage-input artifacts/coverage-report "$GITHUB_STEP_SUMMARY"
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: |
          node eng/ci/scan/main.mjs artifacts \
            artifacts/coverage-report/
      - name: Upload required merged coverage
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage-report/
          if-no-files-found: error
          retention-days: 14
