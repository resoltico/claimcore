name: Publish release
run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag in vMAJOR.MINOR.PATCH form
        required: true
        type: string
      expected_sha:
        description: Full commit SHA the tag identifies
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      actions: read # Read the CI conclusion for the tagged commit.
      attestations: write # Publish provenance for the image and archives.
      contents: write # Create the release for the existing tag.
      id-token: write # Authenticate the provenance signer.
      packages: write # Publish the server image to GHCR.
    env:
      IMAGE_REPOSITORY: ghcr.io/resoltico/claimcore-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag and main CI gate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#v}"

          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$sha" = "$EXPECTED_SHA"
          # GitHub provenance records the dispatch commit from the runner's OIDC token.
          if [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "The release tag must identify the main commit that started this run." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$sha" origin/main

          conclusion="$(gh run list --workflow ci.yml --commit "$sha" --event push \
            --json conclusion,headBranch --jq '[.[] | select(.headBranch == "main")][0].conclusion')"
          test "$conclusion" = "success"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify the product version and extract release notes
        env:
          TAG: ${{ inputs.tag }}
        run: python3 eng/versioning.py release-notes "$TAG" > notes.md
      - name: Require complete current translations for every offered language
        run: |
          dotnet restore eng/ClaimCore.ContractGenerator --locked-mode
          dotnet run --project eng/ClaimCore.ContractGenerator --configuration Release --no-restore -- --check-translations
      - name: Build the server and CLI distribution
        id: distribution
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_ARTIFACTS: ${{ runner.temp }}/claimcore-release
        run: |
          set -euo pipefail
          test ! -e "$RELEASE_ARTIFACTS"
          bash eng/build-release-artifacts.sh "$RELEASE_ARTIFACTS" "$IMAGE_REPOSITORY:$CANDIDATE_VERSION"
          (cd "$RELEASE_ARTIFACTS" && shasum -a 256 -c SHA256SUMS)
          echo "directory=$RELEASE_ARTIFACTS" >> "$GITHUB_OUTPUT"
      - name: Push the versioned server image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="$IMAGE_REPOSITORY:$CANDIDATE_VERSION"
          # The attestation action reads inline credentials from the runner's standard Docker config.
          printf '%s\n' "$GH_TOKEN" | docker --config "$HOME/.docker" login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin
          jq -e '.auths["ghcr.io"].auth | type == "string" and length > 0' \
            "$HOME/.docker/config.json" >/dev/null
          docker --config "$HOME/.docker" push "$image" | tee "$RUNNER_TEMP/claimcore-image-push.log"
          digest="$(sed -nE 's/^[^ ]+: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/claimcore-image-push.log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the pushed server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Clear registry credentials
        if: always() && steps.image.outcome != 'skipped'
        run: docker --config "$HOME/.docker" logout ghcr.io

      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.distribution.outputs.directory }}/SOURCE.tar.gz
            ${{ steps.distribution.outputs.directory }}/SHA256SUMS
            ${{ steps.distribution.outputs.directory }}/claimcore-cli-*.tar.gz

      - name: Publish the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_ARTIFACTS: ${{ steps.distribution.outputs.directory }}
        run: |
          set -euo pipefail
          (cd "$RELEASE_ARTIFACTS" && shasum -a 256 -c SHA256SUMS)
          printf "\\nServer image: \`%s@%s\`\\n" "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "$RELEASE_ARTIFACTS/SOURCE.tar.gz" "$RELEASE_ARTIFACTS/SHA256SUMS" "$RELEASE_ARTIFACTS"/claimcore-cli-*.tar.gz
