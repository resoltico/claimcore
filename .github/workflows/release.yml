name: Publish source release
run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag, for example v0.9.0
        required: true
        type: string
      expected_sha:
        description: Full commit SHA the tag identifies
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified source release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read # Read the CI conclusion for the tagged commit.
      contents: write # Create the release for the existing tag.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag, version and gate, then publish the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#v}"

          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$sha" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$sha" origin/main

          git show "$sha:Directory.Build.props" | grep -Fq "<Version>$version</Version>"

          conclusion="$(gh run list --workflow ci.yml --commit "$sha" --event push \
            --json conclusion,headBranch --jq "[.[] | select(.headBranch == \"$TAG\")][0].conclusion")"
          test "$conclusion" = "success"

          git show "$sha:CHANGELOG.md" | awk -v version="$version" '
            $0 ~ "^## \\[" version "\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' > notes.md
          test -s notes.md

          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
