name: Temporary localization WebKit geometry probe
on:
  push:
    branches: [feat/presentation-localization]
    paths: [.github/workflows/localization-layout-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b2f37f4963da1dabd41770cd282ca2e5ccc01624
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-published-35800810312-1
          run-id: 35800810312
          github-token: ${{ github.token }}
          path: artifacts/publish-input
      - name: Install the pinned browser and instrument numeric geometry only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b2f37f4963da1dabd41770cd282ca2e5ccc01624
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps webkit
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/e2e/localization-support.ts')
          s=p.read_text()
          start=s.index('export const noHorizontalOverflow =')
          end=s.index('\nexport const expectKeyboardContained',start)
          replacement='''export const noHorizontalOverflow = async (page: Page): Promise<void> => {
            const measure = () => page.evaluate(() => {
              const root = document.documentElement;
              const rects = Array.from(document.querySelectorAll('body *')).filter(e => !e.closest('[inert]')).map((e,index) => {
                const r=e.getBoundingClientRect(); const c=getComputedStyle(e);
                return {index,tag:e.tagName,left:r.left,right:r.right,width:r.width,scrollWidth:e.scrollWidth,clientWidth:e.clientWidth,display:c.display,minWidth:c.minWidth,maxWidth:c.maxWidth,whiteSpace:c.whiteSpace,overflowWrap:c.overflowWrap};
              }).filter(r=>r.width>0 && (r.left < -1 || r.right > root.clientWidth + 1));
              return {viewport:innerWidth,clientWidth:root.clientWidth,scrollWidth:root.scrollWidth,bodyWidth:document.body.clientWidth,zoom:getComputedStyle(root).zoom,rtl:root.dir==='rtl',rects};
            });
            const before=await measure();
            const patch=await page.addStyleTag({content:'.copy-value {min-inline-size:0;max-inline-size:100%}.copy-value textarea {min-inline-size:0;max-inline-size:100%}'});
            const constrainedCopy=await measure(); await patch.evaluate(e=>e.remove());
            const flow=await page.addStyleTag({content:'button {white-space:normal;overflow-wrap:anywhere;min-inline-size:0;max-inline-size:100%}'});
            const wrappingButtons=await measure(); await flow.evaluate(e=>e.remove());
            const output=process.env['CLAIMCORE_LAYOUT_PROBE'];
            if(output===undefined) throw new Error('LAYOUT_PROBE_PATH_MISSING');
            await import('node:fs/promises').then(fs=>fs.appendFile(output,JSON.stringify({before,constrainedCopy,wrappingButtons})+'\\n'));
            expect(before.scrollWidth <= before.clientWidth + 1).toBe(true);
          };
          '''
          p.write_text(s[:start]+replacement+s[end:])
          c=Path('web/playwright.config.ts'); text=c.read_text(); text=text.replace('testDir: "./e2e",','testDir: "./e2e",\n  grep: /supports Arabic direction and expanded copy at narrow width and zoom/,' ); c.write_text(text)
          PY
      - name: Reproduce the unchanged published layout with safe measurements
        shell: bash
        env:
          CLAIMCORE_TEST_RUN_LABEL: claimcore-browser-layout-${{ github.run_id }}-${{ github.run_attempt }}
          CLAIMCORE_LAYOUT_PROBE: ${{ github.workspace }}/artifacts/browser/layout-probe.jsonl
        run: |
          set -euo pipefail
          set +e
          bash eng/Run-PublishedWebE2E.sh artifacts/publish-input/web artifacts/publish-input/database webkit
          status=$?
          set -e
          echo "Isolated geometry reproduction exit status: $status"
          test -s artifacts/browser/layout-probe.jsonl
      - name: Scan numeric probe before upload
        shell: pwsh
        run: pwsh -NoProfile -File eng/Scan-ArtifactSecrets.ps1 artifacts/browser/layout-probe.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localization-webkit-geometry
          path: artifacts/browser/layout-probe.jsonl
          retention-days: 1
          if-no-files-found: error
