name: ClaimCore extended property and fuzz exploration

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      base_seed:
        description: Canonical unsigned 64-bit Hedgehog base seed
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLAIMCORE_PROPERTY_PROFILE: extended

jobs:
  properties:
    name: Properties and boundary fuzzing at 5,000 cases
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Select and validate the public exploration seed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_SEED: ${{ inputs.base_seed }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          seed="$(node eng/ci/policy/property-seed.mjs)"
          echo "CLAIMCORE_PROPERTY_BASE_SEED=$seed" >> "$GITHUB_ENV"
      - name: Restore the locked source tree
        run: dotnet restore ClaimCore.slnx --locked-mode
      - name: Run the complete extended profile
        run: node eng/ci/suites/suite.mjs run unit fuzz --build --results-root artifacts/properties-results
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: node eng/ci/scan/main.mjs artifacts artifacts/properties-results/
      - name: Upload required extended-profile evidence
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-properties-extended-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/properties-results/
          if-no-files-found: error
          retention-days: 30
