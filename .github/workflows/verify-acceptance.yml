name: ClaimCore published CLI acceptance

on:
  workflow_call:

permissions:
  contents: read

env:
  CLAIMCORE_TEST_RUN_LABEL: claimcore-acceptance-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  acceptance:
    name: Published authenticated CLI acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - name: Admit the explicit job checkout
        shell: bash
        run: node eng/ci/job-context.mjs create >> "$GITHUB_ENV"
      - name: Download the exact current-attempt published applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish-input
      - name: Download the exact current-attempt generated contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/contracts-input
      - name: Restore and build only the acceptance harness
        run: |
          dotnet tool restore
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet build tests/ClaimCore.AcceptanceTests/ClaimCore.AcceptanceTests.fsproj --configuration Release --no-restore
      - name: Install locked browser qualification dependencies
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium
          mkdir -p web/src/generated/contracts
          cp -R artifacts/contracts-input/. web/src/generated/contracts/
          npm --prefix web run contract:verify
      - name: Run all published-boundary acceptance tests
        shell: bash
        env:
          CLAIMCORE_PUBLISHED_CLI_DIR: ${{ github.workspace }}/artifacts/publish-input/cli
          CLAIMCORE_ACCEPTANCE_RESULTS_DIR: ${{ github.workspace }}/artifacts/test-results/acceptance
        run: |
          set -euo pipefail
          node eng/ci/publish/main.mjs verify artifacts/publish-input
          dotnet tool run coverlet -- artifacts/publish-input/cli \
            --target bash \
            --targetargs "eng/Run-PublishedWebE2E.sh artifacts/publish-input/web artifacts/publish-input/database chromium" \
            --include '[ClaimCore.Cli]*' --exclude-assemblies-without-sources None --format cobertura \
            --output artifacts/test-results/acceptance/cli.coverage.cobertura.acceptance.xml --verbosity minimal
          node eng/ci/coverage-policy/cli.mjs artifacts/test-results/acceptance/cli.coverage.cobertura.acceptance.xml
          node eng/ci/publish/main.mjs verify artifacts/publish-input
      - name: Remove only this run's labeled acceptance containers
        if: always()
        shell: bash
        run: bash eng/Remove-LabeledTestContainers.sh "$CLAIMCORE_TEST_RUN_LABEL"
      - name: Recheck admitted job inputs before evidence scanning
        id: job_checkout_current
        if: always()
        run: node eng/ci/job-context.mjs check
      - name: Retain sanitized browser reports with acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-results/acceptance/browser
          for report in artifacts/browser/chromium.json artifacts/browser/chromium.diagnostics.json; do
            if [[ -f "$report" ]]; then
              cp "$report" artifacts/test-results/acceptance/browser/
            fi
          done
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: |
          node eng/ci/scan/main.mjs artifacts \
            artifacts/test-results/acceptance/
      - name: Upload the acceptance results
        if: ${{ always() && steps.artifact_scan.outcome == 'success' && steps.job_checkout_current.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-test-acceptance-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/acceptance/
          if-no-files-found: error
          retention-days: 14
