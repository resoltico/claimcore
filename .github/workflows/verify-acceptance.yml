name: ClaimCore published CLI acceptance

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true
  CLAIMCORE_TEST_RUN_LABEL: claimcore-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NO_COLOR: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  acceptance:
    name: Published CLI and PostgreSQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Require the exact Node and npm toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v$(tr -d '\r\n' < .node-version)"
          test "$(npm --version)" = "$(node -p "require('./web/package.json').engines.npm")"
      - name: Download the exact current-attempt published applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish-input
      - name: Restore and build only the acceptance harness and evidence tool
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet build tests/ClaimCore.AcceptanceTests/ClaimCore.AcceptanceTests.fsproj --configuration Release --no-restore
          dotnet build eng/ClaimCore.Docs/ClaimCore.Docs.fsproj --configuration Release --no-restore
      - name: Run all published-boundary acceptance tests
        shell: pwsh
        env:
          CLAIMCORE_ACCEPTANCE_CLI_DIR: ${{ github.workspace }}/artifacts/publish-input/cli
          CLAIMCORE_ACCEPTANCE_DATABASE_DIR: ${{ github.workspace }}/artifacts/publish-input/database
          CLAIMCORE_ACCEPTANCE_CLI_MANIFEST: ${{ github.workspace }}/artifacts/publish-input/manifests/publish-cli.json
          CLAIMCORE_ACCEPTANCE_DATABASE_MANIFEST: ${{ github.workspace }}/artifacts/publish-input/manifests/publish-database.json
        run: |
          Set-StrictMode -Version Latest
          $docs = Join-Path $PWD "artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll"
          & dotnet $docs verify-publish-manifest publish-cli `
            artifacts/publish-input/cli artifacts/publish-input/manifests/publish-cli.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dotnet $docs verify-publish-manifest publish-database `
            artifacts/publish-input/database artifacts/publish-input/manifests/publish-database.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $results = Join-Path $PWD "artifacts/test-results/acceptance-linux"
          if (Test-Path -LiteralPath $results) { throw "The test result directory must start absent." }
          $started = (Get-Date).ToUniversalTime().ToString("O")
          $arguments = @(
            "test", "--project", "tests/ClaimCore.AcceptanceTests/ClaimCore.AcceptanceTests.fsproj",
            "--configuration", "Release", "--no-build", "--no-restore",
            "--max-parallel-test-modules", "1", "--results-directory=$results",
            "--minimum-expected-tests=9", "--zero-tests-policy=strict", "--timeout=30m",
            "--", "--settings=$PWD/eng/expecto.runsettings", "--report-trx",
            "--report-trx-filename=ClaimCore.AcceptanceTests.trx"
          )
          & dotnet @arguments
          $testExit = $LASTEXITCODE
          $finished = (Get-Date).ToUniversalTime().ToString("O")
          if (!(Test-Path -LiteralPath $results)) { New-Item -ItemType Directory -Path $results | Out-Null }
          $outcome = if ($testExit -eq 0) { "success" } else { "failure" }
          & dotnet $docs stage-manifest acceptance-linux "${{ github.run_id }}" "${{ github.run_attempt }}" $outcome $started $finished $results
          $manifestExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          if ($manifestExit -ne 0) { exit $manifestExit }
      - name: Remove only this run's labeled acceptance containers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker container ls --all --quiet)
          for container in "${containers[@]}"; do
            if ! label="$(docker container inspect \
              --format '{{ index .Config.Labels "org.claimcore.test-run" }}' "$container" 2>/dev/null)"; then
              continue
            fi
            if [[ "$label" == "$CLAIMCORE_TEST_RUN_LABEL" ]]; then
              docker container rm --force "$container" >/dev/null
            fi
          done
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File eng/Scan-ArtifactSecrets.ps1 `
            artifacts/test-results/acceptance-linux/ `
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/acceptance-linux.json"
      - name: Upload required acceptance results
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-test-acceptance-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/acceptance-linux/
          if-no-files-found: error
          retention-days: 14
      - name: Upload acceptance stage evidence
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-stage-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/acceptance-linux.json
          if-no-files-found: error
          retention-days: 14
