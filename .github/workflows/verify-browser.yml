name: ClaimCore browser verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Published lifecycle (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Download the exact current-attempt published applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish-input
      - name: Download the exact current-attempt generated contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/contracts-input
      - name: Install locked browser dependencies and the pinned coverage tool
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps "$ENGINE"
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet tool restore
          mkdir -p web/src/generated/contracts
          cp -R artifacts/contracts-input/. web/src/generated/contracts/
          npm --prefix web run contract:verify
      - name: Exercise the isolated published lifecycle
        shell: bash
        env:
          CLAIMCORE_TEST_RUN_LABEL: claimcore-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          test ! -e artifacts/browser
          node eng/ci/publish/main.mjs verify artifacts/publish-input web database
          dotnet tool run coverlet -- artifacts/publish-input/web \
            --target bash \
            --targetargs "eng/Run-PublishedWebE2E.sh artifacts/publish-input/web artifacts/publish-input/database $ENGINE" \
            --include '[ClaimCore.Web]*' --exclude-assemblies-without-sources None --format cobertura \
            --output "artifacts/browser/$ENGINE.coverage.cobertura.e2e.xml" --verbosity minimal
          node eng/ci/coverage/browser.mjs "artifacts/browser/$ENGINE.coverage.cobertura.e2e.xml"
          node eng/ci/publish/main.mjs verify artifacts/publish-input web database
      - name: Remove only this run's labeled browser containers
        if: always()
        shell: bash
        env:
          CLAIMCORE_TEST_RUN_LABEL: claimcore-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}
        run: bash eng/Remove-LabeledTestContainers.sh "$CLAIMCORE_TEST_RUN_LABEL"
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: |
          node eng/ci/scan/main.mjs artifacts \
            artifacts/browser/
      - name: Upload sanitized browser result
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-browser-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser/
          if-no-files-found: error
          retention-days: 14
