name: ClaimCore browser verification

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NO_COLOR: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  browser:
    name: Published lifecycle (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Download the exact current-attempt published applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish-input
      - name: Install locked browser dependencies and evidence tool
        run: |
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps ${{ matrix.engine }}
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet tool restore
          dotnet build eng/ClaimCore.Docs/ClaimCore.Docs.fsproj --configuration Release --no-restore
      - name: Exercise the isolated published lifecycle
        shell: bash
        env:
          CLAIMCORE_TEST_RUN_LABEL: claimcore-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          output=artifacts/browser
          test ! -e "$output"
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll verify-publish-manifest \
            publish-web artifacts/publish-input/web \
            artifacts/publish-input/manifests/publish-web.json
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll verify-publish-manifest \
            publish-database artifacts/publish-input/database \
            artifacts/publish-input/manifests/publish-database.json
          started="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
          set +e
          dotnet tool run coverlet -- artifacts/publish-input/web \
            --target bash \
            --targetargs "eng/Run-PublishedWebE2E.sh artifacts/publish-input/web artifacts/publish-input/database $ENGINE" \
            --include '[ClaimCore.Web]*' --exclude-assemblies-without-sources None --format cobertura \
            --output "artifacts/browser/$ENGINE.coverage.cobertura.e2e.xml" --verbosity minimal
          status=$?
          if [[ "$status" -eq 0 ]]; then
            pwsh -NoProfile -Command "Import-Module ./eng/CoverageInputPolicy.psm1; Assert-ClaimCoreBrowserCoverage 'artifacts/browser/$ENGINE.coverage.cobertura.e2e.xml'"
            coverage_status=$?
            if [[ "$coverage_status" -ne 0 ]]; then status=$coverage_status; fi
          fi
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll verify-publish-manifest \
            publish-web artifacts/publish-input/web \
            artifacts/publish-input/manifests/publish-web.json
          verification_status=$?
          if [[ "$verification_status" -ne 0 ]]; then status=$verification_status; fi
          set -e
          finished="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
          if [[ ! -d "$output" ]]; then mkdir -p "$output"; fi
          outcome=failure
          if [[ "$status" -eq 0 ]]; then outcome=success; fi
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll stage-manifest \
            "browser-$ENGINE" "${{ github.run_id }}" "${{ github.run_attempt }}" "$outcome" \
            "$started" "$finished" "$output"
          exit "$status"
      - name: Remove only this run's labeled browser containers
        if: always()
        shell: bash
        env:
          CLAIMCORE_TEST_RUN_LABEL: claimcore-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.engine }}
        run: bash eng/Remove-LabeledTestContainers.sh "$CLAIMCORE_TEST_RUN_LABEL"
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File eng/Scan-ArtifactSecrets.ps1 `
            artifacts/browser/ `
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/browser-${{ matrix.engine }}.json"
      - name: Upload sanitized browser result
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-browser-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser/
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser stage evidence
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-stage-browser-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/browser-${{ matrix.engine }}.json
          if-no-files-found: error
          retention-days: 14
