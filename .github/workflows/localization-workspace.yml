name: Temporary localization transfer verification
on:
  push:
    branches: [feat/presentation-localization]
    paths: [.github/workflows/localization-workspace.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export source-transfer objects for byte comparison
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/localization-transfer"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          shas = ['6ce66aec5a3a8f15c54911a9b9a395f63b08364a', '9386d0013571d226325c528f2d85a607a0332fc6', 'bc52ad769c1b40c77a9c92be53ece1beb9dc0d9c']
          for index, sha in enumerate(shas, 1):
              data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              content = base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(content)}\0'.encode() + content).hexdigest() == sha
              (pathlib.Path(os.environ['RUNNER_TEMP']) / 'localization-transfer' / f'chunk{index}.txt').write_bytes(content)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localization-transfer-verification
          path: ${{ runner.temp }}/localization-transfer/
          retention-days: 1
          if-no-files-found: error
