name: ClaimCore container operation verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  deployment:
    name: Persistent HTTPS container operation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Download verified current-attempt published applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish
      - name: Qualify the immutable published bytes in Docker
        env:
          CLAIMCORE_PUBLISHED_DIR: ${{ github.workspace }}/artifacts/publish
        run: node eng/ci/deployment/qualify.mjs
