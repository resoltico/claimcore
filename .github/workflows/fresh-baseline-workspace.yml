name: Temporary fresh-baseline source export
on:
  push:
    branches: [feat/fresh-baseline-recovery]
    paths: [.github/workflows/fresh-baseline-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ad45a9c649d14f5cb592d772c56b043c1b093ba2
          persist-credentials: false
      - name: Export only tracked source from the verified base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ad45a9c649d14f5cb592d772c56b043c1b093ba2
          test "$(git rev-parse HEAD^{tree})" = 0bb6a84f4f7afd403c072a627ada86199bfe8ed6
          mkdir "$RUNNER_TEMP/fresh-baseline-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/fresh-baseline-source/source.tar.gz"
          cd "$RUNNER_TEMP/fresh-baseline-source"
          sha256sum source.tar.gz > source.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-baseline-source
          path: ${{ runner.temp }}/fresh-baseline-source/
          retention-days: 1
          if-no-files-found: error
