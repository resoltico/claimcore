name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  NO_COLOR: "1"

jobs:
  lint:
    name: Format, lint and workflow hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: dotnet restore ClaimCore.slnx --locked-mode
      - run: dotnet tool restore
      - run: dotnet fantomas --check src tests eng
      - run: bash eng/Check-FSharpLint.sh
      - run: npm --prefix web ci
      - run: npm --prefix web run contract:generate
      - run: npm --prefix web run format:check
      - run: npm --prefix web run lint
      - run: npm --prefix web run lint:styles
      - run: shellcheck eng/*.sh deployment/*.sh
      - name: actionlint
        run: docker run --rm --label claimcore.workflow-check=actionlint -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
          version: 1.30.1
          advanced-security: false

  unit:
    name: Build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: dotnet restore ClaimCore.slnx --locked-mode
      - run: npm --prefix web ci
      - run: npm --prefix web run contract:generate
      - run: dotnet build ClaimCore.slnx --configuration Release --no-restore
      - name: Unit and property tests
        run: >-
          dotnet test --project tests/ClaimCore.Tests/ClaimCore.Tests.fsproj
          --configuration Release --no-build --no-restore
          --minimum-expected-tests=SET-IN-WP15 --zero-tests-policy=strict --timeout=30m
          -- --settings="$PWD/eng/expecto.runsettings"
      - name: Build the architecture suite without optimization
        run: >-
          dotnet build tests/ClaimCore.ArchitectureTests/ClaimCore.ArchitectureTests.fsproj
          --configuration Debug --no-restore -p:Optimize=false
      - name: Architecture tests
        run: >-
          dotnet test --project tests/ClaimCore.ArchitectureTests/ClaimCore.ArchitectureTests.fsproj
          --configuration Debug --no-build --no-restore
          --minimum-expected-tests=SET-IN-WP15 --zero-tests-policy=strict --timeout=15m
          -- --settings="$PWD/eng/expecto.runsettings"

  integration:
    name: PostgreSQL and web host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: dotnet restore ClaimCore.slnx --locked-mode
      - run: npm --prefix web ci
      - run: npm --prefix web run contract:generate
      - run: dotnet build ClaimCore.slnx --configuration Release --no-restore
      - name: Ledger store on PostgreSQL
        run: >-
          dotnet test --project tests/ClaimCore.IntegrationTests/ClaimCore.IntegrationTests.fsproj
          --configuration Release --no-build --no-restore
          --minimum-expected-tests=78 --zero-tests-policy=strict --timeout=20m
          -- --settings="$PWD/eng/expecto.runsettings"
      - name: Web host, including the live identity provider fixture
        run: >-
          dotnet test --project tests/ClaimCore.WebTests/ClaimCore.WebTests.fsproj
          --configuration Release --no-build --no-restore
          --minimum-expected-tests=66 --zero-tests-policy=strict --timeout=20m
          -- --settings="$PWD/eng/expecto.runsettings"

  frontend:
    name: Frontend types, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: dotnet restore ClaimCore.slnx --locked-mode
      - run: npm --prefix web ci
      - run: npm --prefix web audit --audit-level=low
      - name: Generated contract matches its lock
        run: npm --prefix web run contract:generate && npm --prefix web run contract:verify
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test:unit
      - run: npm --prefix web run build

  acceptance:
    name: Published service, CLI and browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: dotnet restore ClaimCore.slnx --locked-mode
      - run: npm --prefix web ci
      - run: npm --prefix web run contract:generate
      - run: npm --prefix web run build
      - run: dotnet build ClaimCore.slnx --configuration Release --no-restore
      - name: Published CLI against the published service
        run: >-
          dotnet test --project tests/ClaimCore.AcceptanceTests/ClaimCore.AcceptanceTests.fsproj
          --configuration Release --no-build --no-restore
          --minimum-expected-tests=SET-IN-WP15 --zero-tests-policy=strict --timeout=30m
          -- --settings="$PWD/eng/expecto.runsettings"
      - run: npm --prefix web exec -- playwright install --with-deps chromium firefox webkit
      - name: Browser lifecycle and accessibility on three engines
        run: npm --prefix web run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Gate
    if: always()
    needs: [lint, unit, integration, frontend, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Derived from `needs`, so a job added above is gated without a second list to keep in step.
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          test -n "$RESULTS"
          for result in $RESULTS; do
            test "$result" = "success"
          done
