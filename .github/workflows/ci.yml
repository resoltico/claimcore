name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      growth:
        description: Run the nine-profile growth qualification
        type: boolean
        default: false
      comparison_ref:
        description: Optional commit or ref for a full same-host growth comparison
        type: string
        default: ""
      browser_spec:
        description: Optional one-spec browser diagnostic; skips qualification jobs
        type: string
        default: ""
      browser_engine:
        description: Engine for browser_spec diagnostics only
        type: choice
        default: chromium
        options: [chromium, firefox, webkit]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.comparison_ref || 'verification' }}-${{ inputs.browser_spec || 'complete' }}-${{ inputs.browser_engine || 'chromium' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  NO_COLOR: "1"

jobs:
  configuration:
    if: inputs.browser_spec == ''
    name: Derive qualified database and Node inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      postgresql: ${{ steps.inputs.outputs.postgresql }}
      node_image: ${{ steps.inputs.outputs.node_image }}
    steps:
      - name: Validate qualification engine selection before setup
        env:
          BROWSER_ENGINE: ${{ inputs.browser_engine || 'chromium' }}
        run: |
          python3 - <<'PYTHON'
          import os
          if os.environ["BROWSER_ENGINE"] != "chromium":
              raise ValueError("browser_engine requires browser_spec; ordinary qualification selects all engines")
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inputs
        name: Read authoritative image declarations
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          baseline = json.loads(pathlib.Path("db/postgresql-baseline.json").read_text())
          entries = baseline["supportedMajors"]
          majors = [entry["major"] for entry in entries]
          if not majors or len(set(majors)) != len(majors):
              raise ValueError("PostgreSQL baseline needs distinct listed majors")
          for entry in entries:
              image = re.fullmatch(r"postgres:([1-9][0-9]*)\.([0-9]+)@sha256:[0-9a-f]{64}", entry["containerImage"])
              if (type(entry["major"]) is not int or entry["major"] < 1
                  or type(entry["minimumMinor"]) is not int or entry["minimumMinor"] < 0
                  or not image or int(image[1]) != entry["major"] or int(image[2]) < entry["minimumMinor"]):
                  raise ValueError("PostgreSQL image must match its listed major/minimum minor")
          images = re.findall(r"^FROM (node:[^\s]+@sha256:[0-9a-f]{64}) AS node$", pathlib.Path("deployment/Dockerfile").read_text(), re.M)
          if len(images) != 1:
              raise ValueError("Expected one pinned Node stage in deployment/Dockerfile")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("postgresql=" + json.dumps({"major": majors}, separators=(",", ":")) + "\n")
              output.write("node_image=" + images[0] + "\n")
          PYTHON

  lint:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Native format, lint, browser boundaries and workflow hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: bash eng/verify.sh lint workflows
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          version: 1.32.0
          advanced-security: false

  unit:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Pure tests and compiled architecture (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04
            rid: linux-musl-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.rid != 'linux-musl-x64'
        uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - if: matrix.rid != 'linux-musl-x64'
        run: bash eng/verify.sh unit
      - if: matrix.rid == 'linux-musl-x64'
        name: Run the complete native stage on musl
        run: |
          expected_sdk="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' global.json)"
          docker run --rm --env CI=true --env NO_COLOR=1 \
            --env CLAIMCORE_EXPECTED_SDK="$expected_sdk" \
            --env CLAIMCORE_REPORT_OWNER="$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            mcr.microsoft.com/dotnet/sdk:10.0.403-alpine3.24@sha256:cc02b814237a76c4735fb6eeee87181597b5e56f2ce458a435e527674d91f4d7 \
            sh -euc '
              # Keep private report modes while allowing the host runner to retain evidence.
              restore_report_owner() {
                if [ -d /workspace/artifacts/verification ]; then
                  chown -R "$CLAIMCORE_REPORT_OWNER" /workspace/artifacts/verification
                fi
              }
              trap restore_report_owner EXIT
              apk add --no-cache bash=5.3.9-r1 util-linux-misc=2.42.3-r1 python3=3.14.10-r1
              test "$(dotnet --version)" = "$CLAIMCORE_EXPECTED_SDK"
              git config --global --add safe.directory /workspace
              bash eng/verify.sh unit
            '

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-verification-${{ matrix.rid }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/frontend/completion.json
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-*.json
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/cli-failure/**

  integration:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: PostgreSQL ${{ matrix.major }} store tests
    needs: [configuration]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configuration.outputs.postgresql) }}
    env:
      CLAIMCORE_TEST_POSTGRES_MAJOR: ${{ matrix.major }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh postgres

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-verification-${{ matrix.major }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/frontend/completion.json
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-*.json
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/cli-failure/**

  growth:
    name: Manual PostgreSQL ${{ matrix.major }} growth qualification
    if: github.event_name == 'workflow_dispatch' && inputs.growth && inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    needs: [configuration]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configuration.outputs.postgresql) }}
    env:
      CLAIMCORE_TEST_POSTGRES_MAJOR: ${{ matrix.major }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh growth

  web:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Web host and identity tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh web

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-verification
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/frontend/completion.json
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-*.json
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/cli-failure/**

  frontend:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Frontend checks (SDK-free Node container)
    needs: [configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache npm downloads for the SDK-free frontend # zizmor: ignore[cache-poisoning] -- npm verifies lockfile integrity; no build outputs cached.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/claimcore-npm-cache
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Run frontend in the deployment Node image
        env:
          NODE_IMAGE: ${{ needs.configuration.outputs.node_image }}
        run: |
          mkdir -p "${RUNNER_TEMP}/claimcore-npm-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env CI=true --env NO_COLOR=1 --env HOME=/tmp/claimcore-home \
            --env NPM_CONFIG_CACHE=/tmp/claimcore-npm-cache \
            --volume "${RUNNER_TEMP}/claimcore-npm-cache:/tmp/claimcore-npm-cache" \
            --volume "$PWD:/workspace" --workdir /workspace "${NODE_IMAGE}" \
            bash -euo pipefail -c '
              mkdir -p "${HOME}"
              if command -v dotnet >/dev/null 2>&1; then
                echo "Frontend boundary refuses an executable dotnet SDK/runtime." >&2
                exit 1
              fi
              test "$(node --version)" = "v$(tr -d "\r\n" < .node-version)"
              npm install --global --prefix /tmp/claimcore-npm "npm@$(node -p "require(\"./web/package.json\").engines.npm")"
              export PATH="/tmp/claimcore-npm/bin:${PATH}"
              test "$(npm --version)" = "$(node -p "require(\"./web/package.json\").engines.npm")"
              bash eng/verify.sh frontend
            '

  acceptance:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Published clients (${{ matrix.engine }}, complete)
    needs: [frontend]
    strategy:
      fail-fast: true
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    # Allow 10 minutes for setup/reporting around the complete acceptance project's 60-minute MTP bound.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - name: Install isolated NSS profile test utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
      - name: Published service and clients
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/claimcore-npm-cache
          CLAIMCORE_ACCEPTANCE_BROWSER_ENGINE: ${{ matrix.engine }}
          CLAIMCORE_ACCEPTANCE_BROWSER_SCOPE: complete
        run: bash eng/verify.sh browsers acceptance
      - name: Report browser execution
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          BROWSER_SCOPE: complete
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          reports = list(pathlib.Path("artifacts/verification").glob("native.*/browser-*.json"))
          if len(reports) != 1:
              raise ValueError("Expected one completed browser engine report")
          result = json.loads(reports[0].read_text())
          if result["runId"] != reports[0].parent.name:
              raise ValueError("Browser report belongs to another test run")
          if result["engine"] != os.environ["BROWSER_ENGINE"] or result["scope"] != os.environ["BROWSER_SCOPE"]:
              raise ValueError("Browser execution differs from scheduled scope")
          if type(result["passed"]) is not int or result["passed"] < 1:
              raise ValueError("Missing executed browser count")
          message = f"Browser execution: {result['engine']} / {result['scope']}: {result['passed']} passed; {result['duration']}."
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(message + "\n")
          PYTHON

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-verification-${{ matrix.engine }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/frontend/completion.json
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-*.json
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/cli-failure/**

  browser_diagnostic:
    name: One-spec browser diagnostic (not qualification)
    if: github.event_name == 'workflow_dispatch' && inputs.browser_spec != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BROWSER_ENGINE: ${{ inputs.browser_engine || 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the selected existing spec before setup
        env:
          BROWSER_SPEC: ${{ inputs.browser_spec }}
          COMPARISON_REF: ${{ inputs.comparison_ref }}
          GROWTH: ${{ inputs.growth }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re
          if os.environ["BROWSER_ENGINE"] not in {"chromium", "firefox", "webkit"}:
              raise ValueError("Select chromium, firefox or webkit")
          name = os.environ["BROWSER_SPEC"]
          if os.environ["COMPARISON_REF"] or os.environ["GROWTH"] == "true":
              raise ValueError("Choose a diagnostic or qualification, not both")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*\.spec\.ts", name):
              raise ValueError("Select one existing specification basename")
          matches = [p for p in pathlib.Path("web/e2e").rglob("*.spec.ts") if p.name == name]
          if len(matches) != 1:
              raise ValueError("Specification must identify exactly one existing file")
          PYTHON
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- same pinned repository toolchain as qualification.
      - name: Build current diagnostic inputs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet build ClaimCore.slnx --configuration Release --no-restore
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run build
          npm --prefix web exec -- playwright install --with-deps --only-shell chromium
          if [[ "$BROWSER_ENGINE" != "chromium" ]]; then
            npm --prefix web exec -- playwright install --with-deps "$BROWSER_ENGINE"
          fi
      - name: Run the explicitly partial diagnostic
        env:
          CLAIMCORE_TEST_REPORT_DIRECTORY: ${{ github.workspace }}/artifacts/verification/native.browser-diagnostic
          CLAIMCORE_ACCEPTANCE_BROWSER_ENGINE: ${{ env.BROWSER_ENGINE }}
          CLAIMCORE_ACCEPTANCE_BROWSER_SCOPE: diagnostic
          CLAIMCORE_ACCEPTANCE_BROWSER_SPEC: ${{ inputs.browser_spec }}
        run: |
          dotnet test --project tests/ClaimCore.AcceptanceTests/ClaimCore.AcceptanceTests.fsproj \
            --configuration Release --no-build --no-restore --zero-tests-policy=strict --timeout=40m \
            --filter 'FullyQualifiedName~published browser diagnostic' \
            -- --settings=eng/expecto.acceptance.runsettings
      - name: Retain sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostic
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-*.json
            artifacts/verification/native.*/browser-failure/**

  comparison:
    name: Manual same-host growth comparison
    needs: [gate]
    if: github.event_name == 'workflow_dispatch' && inputs.comparison_ref != '' && needs.gate.result == 'success' && inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    runs-on: ubuntu-24.04
    # Three complete same-host pairs require six isolated growth runs.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - name: Compare complete paired workloads
        env:
          COMPARISON_REF: ${{ inputs.comparison_ref }}
          CLAIMCORE_TEST_REPORT_DIRECTORY: ${{ runner.temp }}/claimcore-comparison
        run: |
          set -euo pipefail
          reference="$(git rev-parse --verify --end-of-options "${COMPARISON_REF}^{commit}")"
          bash eng/verify.sh growth-compare "$reference"
      - name: Retain comparison and raw workload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: growth-comparison
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/claimcore-comparison/**/comparison.json
            ${{ runner.temp }}/claimcore-comparison/**/comparison.md
            ${{ runner.temp }}/claimcore-comparison/**/pair-*/growth/*.json
            ${{ runner.temp }}/claimcore-comparison/**/pair-*/growth-failure/**/workload-*.json
            ${{ runner.temp }}/claimcore-comparison/**/pair-*/growth-failure/**/read-workload-*.json
            ${{ runner.temp }}/claimcore-comparison/**/pair-*/growth-failure/**/cardinality.json
            ${{ runner.temp }}/claimcore-comparison/**/pair-*/growth-failure/**/run.json
            ${{ runner.temp }}/claimcore-comparison/**/*-harness.patch

  gate:
    name: Gate
    if: always() && inputs.browser_spec == ''
    needs: [configuration, lint, unit, integration, web, frontend, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          test -n "$RESULTS"
          for result in $RESULTS; do
            test "$result" = "success"
          done
