name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      browser_spec:
        description: Optional one-spec browser diagnostic; skips qualification jobs
        type: string
        default: ""
      browser_engine:
        description: Engine for browser_spec diagnostics only
        type: choice
        default: chromium
        options: [chromium, firefox, webkit]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.browser_spec || 'complete' }}-${{ inputs.browser_engine || 'chromium' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  NO_COLOR: "1"

jobs:
  configuration:
    if: inputs.browser_spec == ''
    name: Derive qualified database and Node inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      postgresql: ${{ steps.inputs.outputs.postgresql }}
      node_image: ${{ steps.inputs.outputs.node_image }}
    steps:
      - name: Validate qualification engine selection before setup
        env:
          BROWSER_ENGINE: ${{ inputs.browser_engine || 'chromium' }}
        run: |
          python3 - <<'PYTHON'
          import os
          if os.environ["BROWSER_ENGINE"] != "chromium":
              raise ValueError("browser_engine requires browser_spec; ordinary qualification selects all engines")
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inputs
        name: Read authoritative image declarations
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          baseline = json.loads(pathlib.Path("db/postgresql-baseline.json").read_text())
          entries = baseline["supportedMajors"]
          majors = [entry["major"] for entry in entries]
          if not majors or len(set(majors)) != len(majors):
              raise ValueError("PostgreSQL baseline needs distinct listed majors")
          for entry in entries:
              image = re.fullmatch(r"postgres:([1-9][0-9]*)\.([0-9]+)@sha256:[0-9a-f]{64}", entry["containerImage"])
              if (type(entry["major"]) is not int or entry["major"] < 1
                  or type(entry["minimumMinor"]) is not int or entry["minimumMinor"] < 0
                  or not image or int(image[1]) != entry["major"] or int(image[2]) < entry["minimumMinor"]):
                  raise ValueError("PostgreSQL image must match its listed major/minimum minor")
          images = re.findall(r"^FROM (node:[^\s]+@sha256:[0-9a-f]{64}) AS node$", pathlib.Path("deployment/Dockerfile").read_text(), re.M)
          if len(images) != 1:
              raise ValueError("Expected one pinned Node stage in deployment/Dockerfile")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("postgresql=" + json.dumps({"major": majors}, separators=(",", ":")) + "\n")
              output.write("node_image=" + images[0] + "\n")
          PYTHON

  lint:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Native format, lint, browser boundaries and workflow hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: bash eng/verify.sh lint workflows
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          version: 1.32.0
          advanced-security: false

  unit:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Pure tests and compiled architecture (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04
            rid: linux-musl-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.rid != 'linux-musl-x64'
        uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - if: matrix.rid != 'linux-musl-x64'
        run: bash eng/verify.sh unit
      - if: matrix.rid == 'linux-musl-x64'
        name: Run the complete native stage on musl
        run: |
          expected_sdk="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' global.json)"
          docker run --rm --env CI=true --env NO_COLOR=1 \
            --env CLAIMCORE_EXPECTED_SDK="$expected_sdk" \
            --env CLAIMCORE_REPORT_OWNER="$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            mcr.microsoft.com/dotnet/sdk:10.0.403-alpine3.24@sha256:5562fd626eec39f6f53218f9b7d7856ab7195d51d846568304fbe85071a3b6e6 \
            sh -euc '
              # Keep private report modes while allowing the host runner to retain evidence.
              restore_report_owner() {
                if [ -d /workspace/artifacts/verification ]; then
                  chown -R "$CLAIMCORE_REPORT_OWNER" /workspace/artifacts/verification
                fi
              }
              trap restore_report_owner EXIT
              apk add --no-cache bash=5.3.9-r1 util-linux-misc=2.42.3-r1 python3=3.14.10-r1
              test "$(dotnet --version)" = "$CLAIMCORE_EXPECTED_SDK"
              git config --global --add safe.directory /workspace
              bash eng/verify.sh unit
            '

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-verification-${{ matrix.rid }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/frontend/completion.json
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/cli-failure/**

  integration:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: PostgreSQL ${{ matrix.major }} store tests
    needs: [configuration]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configuration.outputs.postgresql) }}
    env:
      CLAIMCORE_TEST_POSTGRES_MAJOR: ${{ matrix.major }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh postgres

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-verification-${{ matrix.major }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/frontend/completion.json
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/cli-failure/**

  web:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Web host and identity tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh web

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-verification
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/frontend/completion.json
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/cli-failure/**

  frontend:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Frontend checks (SDK-free Node container)
    needs: [configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache npm downloads for the SDK-free frontend # zizmor: ignore[cache-poisoning] -- npm verifies lockfile integrity; no build outputs cached.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/claimcore-npm-cache
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Run frontend in the deployment Node image
        env:
          NODE_IMAGE: ${{ needs.configuration.outputs.node_image }}
        run: |
          mkdir -p "${RUNNER_TEMP}/claimcore-npm-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env CI=true --env NO_COLOR=1 --env HOME=/tmp/claimcore-home \
            --env NPM_CONFIG_CACHE=/tmp/claimcore-npm-cache \
            --volume "${RUNNER_TEMP}/claimcore-npm-cache:/tmp/claimcore-npm-cache" \
            --volume "$PWD:/workspace" --workdir /workspace "${NODE_IMAGE}" \
            bash -euo pipefail -c '
              mkdir -p "${HOME}"
              if command -v dotnet >/dev/null 2>&1; then
                echo "Frontend boundary refuses an executable dotnet SDK/runtime." >&2
                exit 1
              fi
              test "$(node --version)" = "v$(tr -d "\r\n" < .node-version)"
              npm install --global --prefix /tmp/claimcore-npm "npm@$(node -p "require(\"./web/package.json\").engines.npm")"
              export PATH="/tmp/claimcore-npm/bin:${PATH}"
              test "$(npm --version)" = "$(node -p "require(\"./web/package.json\").engines.npm")"
              bash eng/verify.sh frontend
            '

  acceptance_native:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Published clients (native, complete)
    needs: [frontend]
    runs-on: ubuntu-24.04
    # One complete native published scope, with setup/reporting outside its 40-minute MTP bound.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - name: Install isolated NSS profile test utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
      - name: Published service and clients
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/claimcore-npm-cache
          CLAIMCORE_ACCEPTANCE_BROWSER_ENGINE: chromium
        run: bash eng/verify.sh browsers acceptance-native
      - name: Retain native published evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-verification-native
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/service-captures/*.json
            artifacts/verification/native.*/cli-failure/**

  acceptance:
    if: inputs.browser_spec == '' && (inputs.browser_engine == '' || inputs.browser_engine == 'chromium')
    name: Published browsers (${{ matrix.engine }})
    needs: [frontend]
    strategy:
      fail-fast: true
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    # Each engine owns its fixture/bootstrap/readback under the 45-minute browser MTP bound.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - name: Install isolated NSS profile test utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
      - name: Published service and clients
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/claimcore-npm-cache
          CLAIMCORE_ACCEPTANCE_BROWSER_ENGINE: ${{ matrix.engine }}
        run: bash eng/verify.sh browsers acceptance-browser
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-verification-${{ matrix.engine }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/frontend/completion.json
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/service-captures/*.json
            artifacts/verification/native.*/cli-failure/**

  browser_diagnostic:
    name: One-spec browser diagnostic (not qualification)
    if: github.event_name == 'workflow_dispatch' && inputs.browser_spec != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BROWSER_ENGINE: ${{ inputs.browser_engine || 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- same pinned repository toolchain as qualification.
      - name: Build current diagnostic inputs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet build ClaimCore.slnx --configuration Release --no-restore
          dotnet test --project tests/ClaimCore.AcceptanceTests/ClaimCore.AcceptanceTests.fsproj \
            --configuration Release --no-build --no-restore --zero-tests-policy=strict --timeout=2m \
            --filter 'FullyQualifiedName~owned service logs|FullyQualifiedName~bounded child failures' \
            -- --settings=eng/expecto.acceptance.runsettings
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run build
          npm --prefix web exec -- playwright install --with-deps --only-shell chromium
          if [[ "$BROWSER_ENGINE" != "chromium" ]]; then
            npm --prefix web exec -- playwright install --with-deps "$BROWSER_ENGINE"
          fi
      - name: Run the explicitly partial diagnostic
        env:
          CLAIMCORE_TEST_REPORT_DIRECTORY: ${{ github.workspace }}/artifacts/verification/native.browser-diagnostic
          CLAIMCORE_ACCEPTANCE_BROWSER_ENGINE: ${{ env.BROWSER_ENGINE }}
          CLAIMCORE_ACCEPTANCE_BROWSER_SPEC: ${{ inputs.browser_spec }}
        run: |
          dotnet test --project tests/ClaimCore.AcceptanceTests/ClaimCore.AcceptanceTests.fsproj \
            --configuration Release --no-build --no-restore --zero-tests-policy=strict --timeout=40m \
            --filter 'FullyQualifiedName~published browser acceptance' \
            -- --settings=eng/expecto.acceptance.runsettings
      - name: Retain sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostic
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/verification/native.*/results.trx
            artifacts/verification/native.*/browser-failure/**
            artifacts/verification/native.*/service-captures/*.json

  gate:
    name: Gate
    if: always() && inputs.browser_spec == ''
    needs: [configuration, lint, unit, integration, web, frontend, acceptance_native, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          test -n "$RESULTS"
          for result in $RESULTS; do
            test "$result" = "success"
          done
