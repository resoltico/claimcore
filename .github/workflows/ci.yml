name: ClaimCore verification

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  quality:
    name: Source, dependency, and infrastructure quality
    uses: ./.github/workflows/verify-quality.yml

  frontend:
    name: Frontend gates
    uses: ./.github/workflows/verify-frontend.yml

  frontend-product:
    name: Frontend product
    uses: ./.github/workflows/verify-frontend-product.yml

  suites:
    name: Registered suites
    uses: ./.github/workflows/verify-suites.yml

  integration:
    name: PostgreSQL integration
    uses: ./.github/workflows/verify-integration.yml

  documentation:
    name: Documentation assurance
    uses: ./.github/workflows/verify-documentation.yml

  publish:
    name: Immutable published applications
    needs: [frontend-product]
    uses: ./.github/workflows/verify-publish.yml

  acceptance:
    name: Published CLI acceptance
    needs: [publish]
    uses: ./.github/workflows/verify-acceptance.yml

  browser:
    name: Published browser lifecycle
    needs: [publish]
    uses: ./.github/workflows/verify-browser.yml

  coverage:
    name: Merged .NET coverage
    needs: [suites, integration, browser]
    uses: ./.github/workflows/verify-coverage.yml

  gate:
    name: Gate
    if: always()
    needs:
      - quality
      - frontend
      - frontend-product
      - suites
      - integration
      - documentation
      - publish
      - acceptance
      - browser
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Derived from `needs`, so a family added above is gated automatically. A second hand-written
      # list here could fall out of step with `needs` and silently stop gating a whole family.
      - name: Require every verification family
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Verification family results: $RESULTS"
          test -n "$RESULTS"
          for result in $RESULTS; do
            test "$result" = "success"
          done
