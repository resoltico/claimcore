name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  NO_COLOR: "1"

jobs:
  configuration:
    name: Derive matrices and Node image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.inputs.outputs.platforms }}
      engines: ${{ steps.inputs.outputs.engines }}
      full: ${{ steps.inputs.outputs.full }}
      docs_only: ${{ steps.inputs.outputs.docs_only }}
      node_image: ${{ steps.inputs.outputs.node_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: inputs
        name: Read authoritative image declarations
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, subprocess
          full = os.environ["EVENT_NAME"] != "pull_request"
          platforms = [{"os": "ubuntu-24.04", "rid": "linux-x64"}]
          if full:
              platforms += [{"os": "ubuntu-24.04", "rid": "linux-musl-x64"}, {"os": "macos-15", "rid": "osx-arm64"}]
          engines = [{"engine": "chromium", "shard": "1/2"}, {"engine": "chromium", "shard": "2/2"}]
          if full:
              engines += [{"engine": engine, "shard": "1/1"} for engine in ["firefox", "webkit"]]
          docs_only = False
          if not full:
              paths = subprocess.check_output(["git", "diff", "--name-only", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]]).decode().split("\0")[:-1]
              def documentation(path):
                  if path in {"LICENSE", "PROJECT-NOTICE.md", "LICENSE-COMMERCIAL.md"}:
                      return False
                  return path.startswith("docs/") or (path.endswith(".md") and not path.startswith(("src/", "web/", "tests/")))
              docs_only = bool(paths) and all(documentation(path) for path in paths)
          images = re.findall(r"^FROM (node:[^\s]+@sha256:[0-9a-f]{64}) AS node$", pathlib.Path("deployment/Dockerfile").read_text(), re.M)
          if len(images) != 1:
              raise ValueError("Expected one pinned Node stage in deployment/Dockerfile")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("platforms=" + json.dumps({"include": platforms}, separators=(",", ":")) + "\n")
              output.write("engines=" + json.dumps({"include": engines}, separators=(",", ":")) + "\n")
              output.write("docs_only=" + str(docs_only).lower() + "\n")
              output.write("full=" + str(full).lower() + "\n")
              output.write("node_image=" + images[0] + "\n")
          PYTHON

  lint:
    name: Native formatting and workflow hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: bash eng/verify.sh lint workflows
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          version: 1.32.0
          advanced-security: false

  unit:
    name: Pure tests and compiled architecture (${{ matrix.rid }})
    needs: [configuration]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configuration.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.rid != 'linux-musl-x64'
        uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - if: matrix.rid != 'linux-musl-x64'
        run: bash eng/verify.sh unit
      - if: matrix.rid == 'linux-musl-x64'
        name: Run the complete native stage on musl
        run: |
          expected_sdk="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' global.json)"
          docker run --rm --env CI=true --env NO_COLOR=1 \
            --env CLAIMCORE_EXPECTED_SDK="$expected_sdk" \
            --env CLAIMCORE_REPORT_OWNER="$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            mcr.microsoft.com/dotnet/sdk:11.0.100-alpine3.24@sha256:52556c0fb9d0f609ae9aeab9efeeba96f4acc2f7038f7696f2235ccbdbb8e290 \
            sh -euc '
              # Keep private report modes while allowing the host runner to retain evidence.
              restore_report_owner() {
                if [ -d /workspace/artifacts/verification ]; then
                  chown -R "$CLAIMCORE_REPORT_OWNER" /workspace/artifacts/verification
                fi
              }
              trap restore_report_owner EXIT
              apk add --no-cache bash=5.3.9-r1 util-linux-misc=2.42.3-r1 python3=3.14.10-r1 tar=1.35-r5
              test "$(dotnet --version)" = "$CLAIMCORE_EXPECTED_SDK"
              git config --global --add safe.directory /workspace
              bash eng/verify.sh unit
            '

      - name: Retain verification evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-verification-${{ matrix.rid }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/verification/**

  integration:
    if: needs.configuration.outputs.docs_only != 'true'
    name: PostgreSQL store tests
    needs: [configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh postgres

      - name: Retain verification evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-verification
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/verification/**

  server:
    if: needs.configuration.outputs.docs_only != 'true'
    name: Server host and identity tests
    needs: [configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh server

      - name: Retain verification evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-verification
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/verification/**

  frontend:
    if: needs.configuration.outputs.docs_only != 'true'
    name: Frontend checks (SDK-free Node container)
    needs: [configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache npm downloads for the SDK-free frontend # zizmor: ignore[cache-poisoning] -- npm verifies lockfile integrity; no build outputs cached.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/claimcore-npm-cache
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Run frontend in the deployment Node image
        env:
          NODE_IMAGE: ${{ needs.configuration.outputs.node_image }}
        run: |
          mkdir -p "${RUNNER_TEMP}/claimcore-npm-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env CI=true --env NO_COLOR=1 --env HOME=/tmp/claimcore-home \
            --env NPM_CONFIG_CACHE=/tmp/claimcore-npm-cache \
            --volume "${RUNNER_TEMP}/claimcore-npm-cache:/tmp/claimcore-npm-cache" \
            --volume "$PWD:/workspace" --workdir /workspace "${NODE_IMAGE}" \
            bash -euo pipefail -c '
              mkdir -p "${HOME}"
              if command -v dotnet >/dev/null 2>&1; then
                echo "Frontend boundary refuses an executable dotnet SDK/runtime." >&2
                exit 1
              fi
              test "$(node --version)" = "v$(tr -d "\r\n" < .node-version)"
              npm install --global --prefix /tmp/claimcore-npm "npm@$(node -p "require(\"./web/package.json\").engines.npm")"
              export PATH="/tmp/claimcore-npm/bin:${PATH}"
              test "$(npm --version)" = "$(node -p "require(\"./web/package.json\").engines.npm")"
              bash eng/verify.sh frontend
            '

  acceptance_native:
    if: needs.configuration.outputs.docs_only != 'true'
    name: Published clients (native, ${{ matrix.shard }})
    needs: [configuration, frontend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [walkthrough, remaining]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - name: Install isolated NSS profile test utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
      - name: Published service and clients
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/claimcore-npm-cache
          CLAIMCORE_ACCEPTANCE_BROWSER_ENGINE: chromium
          CLAIMCORE_ACCEPTANCE_SHARD: ${{ matrix.shard }}
        run: bash eng/verify.sh browsers acceptance-native
      - name: Retain native published evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-verification-native-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/verification/**

  acceptance:
    if: needs.configuration.outputs.docs_only != 'true'
    name: Published browsers (${{ matrix.engine }}, ${{ matrix.shard }})
    needs: [configuration, frontend]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configuration.outputs.engines) }}
    runs-on: ubuntu-24.04
    # Each engine owns its fixture/bootstrap/readback under the 45-minute browser MTP bound.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - name: Install isolated NSS profile test utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
      - name: Published service and clients
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/claimcore-npm-cache
          CLAIMCORE_ACCEPTANCE_BROWSER_ENGINE: ${{ matrix.engine }}
          CLAIMCORE_ACCEPTANCE_BROWSER_SHARD: ${{ matrix.shard }}
        run: bash eng/verify.sh browsers acceptance-browser
      - name: Retain verification evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-verification-${{ matrix.engine }}-${{ strategy.job-index }}
          retention-days: 3
          if-no-files-found: warn
          path: artifacts/verification/**

  advisories:
    if: needs.configuration.outputs.docs_only != 'true'
    name: Dependency advisories
    needs: [configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- checkout supplies this pinned action.
        if: needs.configuration.outputs.full == 'true'
      - name: Audit dependencies on full runs
        if: needs.configuration.outputs.full == 'true'
        run: bash eng/verify.sh advisories

  gate:
    name: Gate
    if: always()
    needs: [configuration, lint, unit, integration, server, frontend, acceptance_native, acceptance, advisories]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.configuration.outputs.docs_only }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ["RESULTS"])
          docs_only = os.environ["DOCS_ONLY"] == "true"
          for name, job in jobs.items():
              result = job["result"]
              print(name + ": " + result)
              allowed = {"success", "skipped"} if docs_only and name not in {"configuration", "lint", "unit"} else {"success"}
              if result not in allowed:
                  raise SystemExit(1)
          PYTHON
