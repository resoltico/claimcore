name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      growth:
        description: Run the nine-profile growth qualification
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  NO_COLOR: "1"

jobs:
  configuration:
    name: Derive qualified database and Node inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      postgresql: ${{ steps.inputs.outputs.postgresql }}
      node_image: ${{ steps.inputs.outputs.node_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inputs
        name: Read authoritative image declarations
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          baseline = json.loads(pathlib.Path("db/postgresql-baseline.json").read_text())
          entries = baseline["supportedMajors"]
          majors = [entry["major"] for entry in entries]
          if not majors or len(set(majors)) != len(majors):
              raise ValueError("PostgreSQL baseline needs distinct listed majors")
          for entry in entries:
              image = re.fullmatch(r"postgres:([1-9][0-9]*)\.([0-9]+)@sha256:[0-9a-f]{64}", entry["containerImage"])
              if (type(entry["major"]) is not int or entry["major"] < 1
                  or type(entry["minimumMinor"]) is not int or entry["minimumMinor"] < 0
                  or not image or int(image[1]) != entry["major"] or int(image[2]) < entry["minimumMinor"]):
                  raise ValueError("PostgreSQL image must match its listed major/minimum minor")
          images = re.findall(r"^FROM (node:[^\s]+@sha256:[0-9a-f]{64}) AS node$", pathlib.Path("deployment/Dockerfile").read_text(), re.M)
          if len(images) != 1:
              raise ValueError("Expected one pinned Node stage in deployment/Dockerfile")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("postgresql=" + json.dumps({"major": majors}, separators=(",", ":")) + "\n")
              output.write("node_image=" + images[0] + "\n")
          PYTHON

  lint:
    name: Native format, lint, browser boundaries and workflow hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - run: bash eng/verify.sh lint workflows
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: pedantic
          version: 1.31.1
          advanced-security: false

  unit:
    name: Pure tests and compiled architecture (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04
            rid: linux-musl-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.rid != 'linux-musl-x64'
        uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - if: matrix.rid != 'linux-musl-x64'
        run: bash eng/verify.sh unit
      - if: matrix.rid == 'linux-musl-x64'
        name: Run the complete native stage on musl
        run: |
          expected_sdk="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' global.json)"
          docker run --rm --env CI=true --env NO_COLOR=1 \
            --env CLAIMCORE_EXPECTED_SDK="$expected_sdk" \
            --volume "$PWD:/workspace" --workdir /workspace \
            mcr.microsoft.com/dotnet/sdk:10.0.403-alpine3.24@sha256:cc02b814237a76c4735fb6eeee87181597b5e56f2ce458a435e527674d91f4d7 \
            sh -euc '
              apk add --no-cache bash=5.3.9-r1 util-linux-misc=2.42.3-r1 python3=3.14.10-r1
              test "$(dotnet --version)" = "$CLAIMCORE_EXPECTED_SDK"
              git config --global --add safe.directory /workspace
              bash eng/verify.sh unit
            '

  integration:
    name: PostgreSQL ${{ matrix.major }} store tests
    needs: [configuration]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configuration.outputs.postgresql) }}
    env:
      CLAIMCORE_TEST_POSTGRES_MAJOR: ${{ matrix.major }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh postgres

  growth:
    name: Manual PostgreSQL ${{ matrix.major }} growth qualification
    if: github.event_name == 'workflow_dispatch' && inputs.growth
    needs: [configuration]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configuration.outputs.postgresql) }}
    env:
      CLAIMCORE_TEST_POSTGRES_MAJOR: ${{ matrix.major }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh growth

  web:
    name: Web host and identity tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
        with:
          node: "false"
      - run: bash eng/verify.sh web

  frontend:
    name: Frontend checks (SDK-free Node container)
    needs: [configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache npm downloads for the SDK-free frontend # zizmor: ignore[cache-poisoning] -- npm verifies lockfile integrity; no build outputs cached.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/claimcore-npm-cache
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Run frontend in the deployment Node image
        env:
          NODE_IMAGE: ${{ needs.configuration.outputs.node_image }}
        run: |
          mkdir -p "${RUNNER_TEMP}/claimcore-npm-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env CI=true --env NO_COLOR=1 --env HOME=/tmp/claimcore-home \
            --env NPM_CONFIG_CACHE=/tmp/claimcore-npm-cache \
            --volume "${RUNNER_TEMP}/claimcore-npm-cache:/tmp/claimcore-npm-cache" \
            --volume "$PWD:/workspace" --workdir /workspace "${NODE_IMAGE}" \
            bash -euo pipefail -c '
              mkdir -p "${HOME}"
              if command -v dotnet >/dev/null 2>&1; then
                echo "Frontend boundary refuses an executable dotnet SDK/runtime." >&2
                exit 1
              fi
              test "$(node --version)" = "v$(tr -d "\r\n" < .node-version)"
              npm install --global --prefix /tmp/claimcore-npm "npm@$(node -p "require(\"./web/package.json\").engines.npm")"
              export PATH="/tmp/claimcore-npm/bin:${PATH}"
              test "$(npm --version)" = "$(node -p "require(\"./web/package.json\").engines.npm")"
              bash eng/verify.sh frontend
            '

  acceptance:
    name: Published clients (${{ matrix.engine }}, complete)
    needs: [frontend]
    strategy:
      fail-fast: true
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects $/ syntax; checkout supplies this action.
      - name: Install isolated NSS profile test utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools
      - name: Published service and clients
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/claimcore-npm-cache
          CLAIMCORE_ACCEPTANCE_BROWSER_ENGINE: ${{ matrix.engine }}
          CLAIMCORE_ACCEPTANCE_BROWSER_SCOPE: complete
        run: bash eng/verify.sh browsers acceptance
      - name: Report browser execution
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          BROWSER_SCOPE: complete
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          reports = list(pathlib.Path("artifacts/verification").glob("native.*/browser-*.json"))
          if len(reports) != 1:
              raise ValueError("Expected one completed browser engine report")
          result = json.loads(reports[0].read_text())
          if result["runId"] != reports[0].parent.name:
              raise ValueError("Browser report belongs to another test run")
          if result["engine"] != os.environ["BROWSER_ENGINE"] or result["scope"] != os.environ["BROWSER_SCOPE"]:
              raise ValueError("Browser execution differs from scheduled scope")
          if type(result["passed"]) is not int or result["passed"] < 1:
              raise ValueError("Missing executed browser count")
          message = f"Browser execution: {result['engine']} / {result['scope']}: {result['passed']} passed; {result['duration']}."
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(message + "\n")
          PYTHON

  gate:
    name: Gate
    if: always()
    needs: [configuration, lint, unit, integration, web, frontend, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          test -n "$RESULTS"
          for result in $RESULTS; do
            test "$result" = "success"
          done
