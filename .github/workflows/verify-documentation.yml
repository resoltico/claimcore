name: ClaimCore documentation verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation:
    name: Generated documentation, links and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Restore and build the documentation inputs
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet build ClaimCore.slnx --configuration Release --no-restore
      - name: Check generated blocks, links and contracts, then prove write is byte-idle
        run: node eng/ci/policy/documentation.mjs
