name: Compose restart

# CI calls the same smoke script for qualification. This workflow checks scheduled and on-demand runs.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: compose-restart-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restart:
    name: Compose stack survives down and up
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, start, stop and restart the evaluation stack
        run: bash eng/compose-restart-smoke.sh
