name: Temporary core-outcome diagnostics reproduction
on:
  push:
    branches: [feat/typed-core-outcome-diagnostics]
    paths: [.github/workflows/outcome-diagnostics-workspace.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 19d64a45daa870050b09d35e9c203ff0584e15b5
          persist-credentials: false
      - name: Apply only the checksum-verified reviewed source delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          if subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() != '6b251c606e1e47b6f28a9102a8290e16ac3dba3c':
              raise SystemExit('Unexpected baseline tree.')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          chunks = []
          for sha in ['8bc88f470167d407430d15b5f67d5339f6529f03', '6a382543b3c5db2d4301d7d9b0f4371a4e4be12e', '287cbd058c1d644c765926dd374c448079cf301c', '9752b632da96d9fa9da31fc120d731214cc1cae2']:
              url = 'https://api.github.com/repos/resoltico/claimcore/git/blobs/' + sha
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                  blob = json.load(response)
              if blob['sha'] != sha or blob['encoding'] != 'base64':
                  raise SystemExit('Unexpected source-delta object.')
              chunks.append(base64.b64decode(blob['content']))
          patch = lzma.decompress(b''.join(chunks))
          if hashlib.sha256(patch).hexdigest() != '812eaa37bf70b8260f7990efdddae2bb042f1f9d1980f8c392c8d7244d8d36a8':
              raise SystemExit('Source-delta checksum mismatch.')
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '-'], input=patch, check=True)
          print('Reviewed source delta applied to the exact merged baseline.')
          PY
      - uses: ./.github/actions/toolchain
      - name: Restore pinned generator dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore eng/ClaimCore.ContractGenerator/ClaimCore.ContractGenerator.fsproj --locked-mode
          npm ci --prefix web --ignore-scripts
      - name: Reproduce all generated artifacts and require the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web run contract:generate
          git add -A
          actual="$(git write-tree)"
          printf 'Reproduced source tree: %s\n' "$actual"
          test "$actual" = 'd11f5f9ac5b85b5f9ffde0e69ce550d4593cc6aa'
          test "$(git ls-files | wc -l | tr -d ' ')" = '781'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '125'
      - name: Store reviewed source objects without changing branches or tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          if git('write-tree').decode().strip() != 'd11f5f9ac5b85b5f9ffde0e69ce550d4593cc6aa':
              raise SystemExit('Candidate changed after reproduction.')
          changed = set(git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0'))
          entries = []
          for record in git('ls-files', '--stage', '-z').decode().strip('\0').split('\0'):
              metadata, path = record.split('\t', 1)
              if path not in changed or path.startswith('.github/workflows/'):
                  continue
              mode, sha, stage = metadata.split()
              if stage != '0' or mode not in ('100644', '100755'):
                  raise SystemExit('Unexpected staged file mode.')
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': git('cat-file', 'blob', sha).decode('utf-8')})
          if len(entries) != 124:
              raise SystemExit('Unexpected reviewed source-file count.')
          payload = json.dumps({'base_tree': '6b251c606e1e47b6f28a9102a8290e16ac3dba3c', 'tree': entries}).encode('utf-8')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          url = 'https://api.github.com/repos/resoltico/claimcore/git/trees'
          with urllib.request.urlopen(urllib.request.Request(url, data=payload, headers=headers, method='POST'), timeout=120) as response:
              result = json.load(response)
          if result['sha'] != '0e3ea54057f401df5eb343094ac57d51679601df':
              raise SystemExit('Stored source tree differs from the reviewed candidate.')
          print('Verified source tree: ' + result['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Exact candidate reproduced: `d11f5f9ac5b85b5f9ffde0e69ce550d4593cc6aa`. Workflow publication remains with the authorized repository connector. No branch or tag was updated by this job.\n')
          PY
