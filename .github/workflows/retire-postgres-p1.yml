name: Retire exact superseded PostgreSQL p1 versions

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Delete the nine predeclared p1 package versions after a successful preflight
        type: boolean
        default: false
      confirmation:
        description: For deletion only, type DELETE 9 P1 VERSIONS
        type: string
        required: false

# Serialize against new image publication. This workflow has no user-supplied
# package, version, or digest parameter, and never deletes a whole package.
concurrency:
  group: claimcore-postgres-publisher
  cancel-in-progress: false

jobs:
  retire:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'resoltico/claimcore' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the guarded main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove fail-closed retirement controls
        run: python3 -m unittest discover -s eng -p 'test_retire_postgres_p1_*.py'

      - name: Verify exact versions, then optionally retire them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIMCORE_RETIRE_EXECUTE: ${{ inputs.execute }}
          CLAIMCORE_RETIRE_CONFIRM: ${{ inputs.confirmation }}
        run: python3 eng/retire_postgres_p1_versions.py

      - name: Confirm the adopted p2 index remains available
        run: docker manifest inspect "$(jq --raw-output .containerImage db/postgresql-baseline.json)" >/dev/null
