name: ClaimCore publication verification

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NO_COLOR: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  publish:
    name: Publish CLI, Database, and Web once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Download the exact current-attempt frontend product
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend-input
      - name: Download the exact current-attempt frontend SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-frontend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend-sbom-input
      - name: Install the verified frontend tree for publication
        shell: bash
        run: |
          set -euo pipefail
          test ! -e web/dist
          test -f artifacts/frontend-input/dist/index.html
          test -f artifacts/frontend-input/dist/claimcore-assets.manifest.json
          mkdir -p web/dist
          cp -R artifacts/frontend-input/dist/. web/dist/
          npm --prefix web run assets:verify
      - name: Restore and build the immutable source tree
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet tool restore
          dotnet build ClaimCore.slnx --configuration Release --no-restore
      - name: Publish and describe all three applications
        shell: bash
        run: |
          set -u
          docs=artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll
          overall=0
          publish_stage() {
            stage="$1"
            project="$2"
            output="$3"
            product="$4"
            test ! -e "$output" || return 1
            version="$(dotnet msbuild "$project" -nologo -verbosity:quiet -property:Configuration=Release -getProperty:Version)"
            test -n "$version" || return 1
            started="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
            if dotnet publish "$project" --configuration Release --no-restore --output "$output" -p:UseAppHost=false; then
              status=0
            else
              status=$?
            fi
            if [[ "$status" -eq 0 ]]; then
              dotnet tool run dotnet-CycloneDX -- "$project" --exclude-dev --disable-package-restore \
                --configuration Release --output "$output" --filename "$product.cdx.json" \
                --output-format Json --no-serial-number --set-name "$product" --set-version "$version" \
                --include-project-references || status=$?
            fi
            if [[ "$status" -eq 0 ]]; then
              pwsh -NoProfile -File eng/Write-DotNetNotices.ps1 \
                -SbomPath "$output/$product.cdx.json" -OutputPath "$output/THIRD-PARTY-NOTICES.txt" \
                || status=$?
            fi
            if [[ "$status" -eq 0 && "$product" == ClaimCore.Web ]]; then
              cp artifacts/frontend-sbom-input/claimcore-web.cdx.json \
                "$output/ClaimCore.Web.frontend.cdx.json" || status=$?
            fi
            finished="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
            if [[ ! -d "$output" ]]; then mkdir -p "$output"; fi
            outcome=failure
            if [[ "$status" -eq 0 ]]; then outcome=success; fi
            if dotnet "$docs" stage-manifest "$stage" "${{ github.run_id }}" "${{ github.run_attempt }}" "$outcome" "$started" "$finished" "$output"; then
              manifest_status=0
            else
              manifest_status=$?
            fi
            node eng/ci/stage-report.mjs publish "$stage" "$status" "$manifest_status" - || overall=1
            if [[ "$status" -ne 0 || "$manifest_status" -ne 0 ]]; then overall=1; fi
          }
          publish_stage publish-cli src/ClaimCore.Cli/ClaimCore.Cli.fsproj artifacts/publish/cli ClaimCore.Cli
          publish_stage publish-database src/ClaimCore.Database/ClaimCore.Database.fsproj artifacts/publish/database ClaimCore.Database
          publish_stage publish-web src/ClaimCore.Web/ClaimCore.Web.fsproj artifacts/publish/web ClaimCore.Web
          exit "$overall"
      - name: Extract and verify canonical product manifests
        shell: bash
        run: |
          set -euo pipefail
          manifests=artifacts/publish/manifests
          test ! -e "$manifests"
          mkdir -p "$manifests"
          for stage in publish-cli publish-database publish-web; do
            source="artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/$stage.json"
            temporary="$manifests/$stage.json.tmp"
            jq --exit-status '.output' "$source" > "$temporary"
            mv "$temporary" "$manifests/$stage.json"
            jq --exit-status --arg stage "$stage" '.stageId == $stage and (.files | length > 0)' "$manifests/$stage.json" >/dev/null
          done
          test -f artifacts/publish/cli/ClaimCore.Cli.dll
          test -f artifacts/publish/database/ClaimCore.Database.dll
          test -f artifacts/publish/web/ClaimCore.Web.dll
          test -f artifacts/publish/web/wwwroot/index.html
          test -f artifacts/publish/web/wwwroot/THIRD-PARTY-NOTICES.txt
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll verify-publish-manifest \
            publish-cli artifacts/publish/cli "$manifests/publish-cli.json"
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll verify-publish-manifest \
            publish-database artifacts/publish/database "$manifests/publish-database.json"
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll verify-publish-manifest \
            publish-web artifacts/publish/web "$manifests/publish-web.json"
          started="$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)"
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll stage-manifest \
            publish-tree-verification "${{ github.run_id }}" "${{ github.run_attempt }}" success \
            "$started" "$(date -u +%Y-%m-%dT%H:%M:%S.0000000+00:00)" "$manifests"
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File eng/Scan-ArtifactSecrets.ps1 `
            artifacts/publish/ `
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/publish-cli.json" `
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/publish-database.json" `
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/publish-web.json" `
            "artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/publish-tree-verification.json" `
            artifacts/diagnostics/publish/
      - name: Upload immutable published applications
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14
      - name: Upload publication stage evidence
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-stage-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/publish-cli.json
            artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/publish-database.json
            artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/publish-web.json
            artifacts/evidence/${{ github.run_id }}/${{ github.run_attempt }}/stages/publish-tree-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload safe publish stage diagnostics
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-diagnostics-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diagnostics/publish/
          if-no-files-found: error
          retention-days: 14
