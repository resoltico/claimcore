name: ClaimCore publication verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish CLI, Database, and Web once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Download the exact current-attempt frontend product
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend-input
      - name: Download the exact current-attempt frontend SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-frontend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sbom
      - name: Download the exact current-attempt generated contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claimcore-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/contracts-input
      - name: Install the verified frontend tree for publication
        shell: bash
        run: |
          set -euo pipefail
          test ! -e web/dist
          test -f artifacts/frontend-input/dist/index.html
          test -f artifacts/frontend-input/dist/claimcore-assets.manifest.json
          mkdir -p web/dist
          cp -R artifacts/frontend-input/dist/. web/dist/
          mkdir -p web/src/generated/contracts
          cp -R artifacts/contracts-input/. web/src/generated/contracts/
          npm --prefix web run contract:verify
          npm --prefix web run assets:verify
      - name: Restore the locked source tree and pinned tools
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet tool restore
      - name: Verify native publish item ownership
        run: bash eng/Test-HostSecurityNativePublishItems.sh
      - name: Publish, describe and verify all three applications
        run: node eng/ci/publish/main.mjs build
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: |
          node eng/ci/scan/main.mjs artifacts \
            artifacts/publish/
      - name: Upload immutable published applications
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14
