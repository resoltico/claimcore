name: ClaimCore quality verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Source, dependency, and infrastructure quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - name: Admit the explicit job checkout
        shell: bash
        run: node eng/ci/job-context.mjs create >> "$GITHUB_ENV"
      - name: Restore the locked source and tools and build with strict compiler policy
        run: node eng/ci/source-build.mjs
      - name: Install the pinned uv
        run: node eng/ci/tools.mjs uv
      - name: Run every registered quality stage concurrently
        env:
          # Lets the workflow audit check action pins and versions against GitHub, not only offline.
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: node eng/ci/run-stages.mjs quality --parallel 4
      - name: Recheck admitted job inputs
        if: always()
        run: node eng/ci/job-context.mjs check
