name: ClaimCore quality verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Source, dependency, and infrastructure quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Install the locked engineering npm graph
        run: npm --prefix eng ci
      - name: Install the pinned uv
        run: node eng/ci/tools.mjs uv
      - name: Restore locked dependencies and pinned tools (NuGet Audit fails the restore)
        run: |
          dotnet restore ClaimCore.slnx --locked-mode
          dotnet tool restore
      - name: Build with strict compiler policy
        run: dotnet build ClaimCore.slnx --configuration Release --no-restore
      - name: Run every registered quality stage concurrently
        env:
          # Lets the workflow audit check action pins and versions against GitHub, not only offline.
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: node eng/ci/run-stages.mjs quality --parallel 4
