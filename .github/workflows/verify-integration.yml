name: ClaimCore PostgreSQL verification

on:
  workflow_call:

permissions:
  contents: read

env:
  CLAIMCORE_TEST_RUN_LABEL: claimcore-integration-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  integration:
    name: PostgreSQL 18.6 integration and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - name: Admit the explicit job checkout
        shell: bash
        run: node eng/ci/job-context.mjs create >> "$GITHUB_ENV"
      - name: Install PostgreSQL 18 backup qualification clients
        shell: bash
        run: |
          set -euo pipefail
          bash eng/Install-BackupQualificationTools.sh
          echo "CLAIMCORE_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/claimcore-age/bin" >> "$GITHUB_PATH"
      - name: Build, check against the inventories, run and verify every PostgreSQL-backed suite
        run: node eng/ci/suites/suite.mjs run --group postgres --build
      - name: Remove only this run's labeled integration containers
        if: always()
        shell: bash
        run: bash eng/Remove-LabeledTestContainers.sh "$CLAIMCORE_TEST_RUN_LABEL"
      - name: Recheck admitted job inputs before evidence scanning
        id: job_checkout_current
        if: always()
        run: node eng/ci/job-context.mjs check
      - name: Scan artifacts before upload
        id: artifact_scan
        if: always()
        shell: bash
        run: |
          node eng/ci/scan/main.mjs artifacts \
            artifacts/test-results/
      - name: Upload the PostgreSQL suite results
        if: ${{ always() && steps.artifact_scan.outcome == 'success' && steps.job_checkout_current.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claimcore-test-postgres-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/
          if-no-files-found: error
          retention-days: 14
