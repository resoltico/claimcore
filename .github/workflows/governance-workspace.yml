name: Temporary governance reproduction
on:
  push:
    branches: [feat/workflow-governance]
    paths: [.github/workflows/governance-workspace.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b18b380f28bbf7943799aa137342aaa71c5c114f
          persist-credentials: false
      - name: Apply checksum-bound candidate to the exact baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          def git(*args): return subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == '1af35f390999d2e4a0b4fd68c317d7a00d9b4e39'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'}
          chunks = []
          for sha in ['71ecfa65a594dc7ea8ef9e00e0ba1d3956848d31', 'bea8d5ddc772648ba2808846f074dfad903e9c28', '0d4ec7aac77b0aee927e50ce3ac33c496e6e794f', '1428e2be55918e804c1a0d77dcdfca77dffc1228', '81c0f86ca1c20116af2529de6d92ab3d2c8ba563', '1a942b1e0480fb81a5fe768083a4c8aefea2b34d', '858d4fe4eafc07243dc9b85c84bdc89a1d48474a']:
              request = urllib.request.Request('https://api.github.com/repos/resoltico/claimcore/git/blobs/' + sha, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response: blob = json.load(response)
              assert blob['sha'] == sha and blob['encoding'] == 'base64'
              chunks.append(base64.b64decode(blob['content']))
          compressed = b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest() == '8173a8710299131bc2d17088bc79db1935c4d9f53e7e63533ea975fc1c5f06d5'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'a4e8caa4e37ef737fb952f67c105488b1668a83d8dc87b0baa6345a39671b475'
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '-'], input=patch, check=True)
          assert git('write-tree').decode().strip() == 'b7105582eda6630f496625a57abcba1ee2ce2693'
          print('Exact governance candidate applied.')
          PY
      - uses: ./.github/actions/toolchain
      - name: Qualify online and structural policy with the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ClaimCore.slnx --locked-mode
          npm --prefix web ci --ignore-scripts
          pwsh -NoProfile -File eng/Test-WorkflowToolchainPolicy.ps1
          pwsh -NoProfile -File eng/Check-WorkflowToolchainPolicy.ps1
          pwsh -NoProfile -File eng/Check-ArtifactUploadPolicy.ps1
          pwsh -NoProfile -File eng/Check-DependencySecurity.ps1
          dotnet build eng/ClaimCore.Docs/ClaimCore.Docs.fsproj --configuration Release --no-restore
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll check
          dotnet artifacts/bin/ClaimCore.Docs/release/ClaimCore.Docs.dll convergence check eng/test-baseline-v0.1.json eng/test-lineage.json eng/assurance-matrix.json
          npm --prefix web run contract:check
          test "$(git write-tree)" = b7105582eda6630f496625a57abcba1ee2ce2693
          git diff --exit-code
      - name: Store only verified source objects without updating a ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          def git(*args): return subprocess.check_output(['git', *args])
          assert git('write-tree').decode().strip() == 'b7105582eda6630f496625a57abcba1ee2ce2693'
          changed = set(git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0'))
          assert len(changed) == 59
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2026-03-10'}
          def post(path, payload):
              request = urllib.request.Request('https://api.github.com/repos/resoltico/claimcore/' + path, data=json.dumps(payload).encode(), headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=120) as response: return json.load(response)
          entries = []
          workflows = []
          for record in git('ls-files', '--stage', '-z').decode().strip('\0').split('\0'):
              metadata, path = record.split('\t', 1)
              if path not in changed: continue
              mode, sha, stage = metadata.split()
              assert stage == '0' and mode in ('100644', '100755')
              content = git('cat-file', 'blob', sha)
              if path.startswith('.github/workflows/'):
                  stored = post('git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
                  assert stored['sha'] == sha
                  workflows.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
              else:
                  entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': content.decode('utf-8')})
          assert len(entries) == 51 and len(workflows) == 8
          result = post('git/trees', {'base_tree': '1af35f390999d2e4a0b4fd68c317d7a00d9b4e39', 'tree': entries})
          assert result['sha'] == '31ed19d4548b140ab468656bdc25e3da28db03ff'
          print('Verified non-workflow source tree: ' + result['sha'])
          print(json.dumps(workflows, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Candidate `b7105582eda6630f496625a57abcba1ee2ce2693` reproduced. Stored source objects only; no branch, tag, settings, PR, or release was changed by this job. Final publication uses the authorized repository connector.\n')
          PY
