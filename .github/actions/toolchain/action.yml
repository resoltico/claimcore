name: ClaimCore toolchain
description: >-
  Prepares the pinned .NET and Node toolchains and validates the supported native compiler/SDK
  baseline. Native jobs compose this action; SDK-free frontend jobs use the pinned Node container.

inputs:
  dotnet:
    description: Set up the .NET SDK selected by global.json.
    required: false
    default: "true"
  node:
    description: Set up the Node release selected by .node-version and assert the exact npm.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Telemetry, logo and color settings are identical for every job, so they live here and not in
    # each workflow. GitHub Actions already sets CI=true.
    - name: Disable telemetry, banners and color for every later step
      shell: bash
      run: |
        {
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
          echo "DOTNET_NOLOGO=1"
          echo "NO_COLOR=1"
          echo "TESTINGPLATFORM_TELEMETRY_OPTOUT=1"
        } >> "$GITHUB_ENV"
    - if: inputs.dotnet == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          src/**/packages.lock.json
          tests/**/packages.lock.json
          eng/**/packages.lock.json
    - if: inputs.dotnet == 'true'
      name: Require the exact .NET SDK
      shell: bash
      run: |
        set -euo pipefail
        expected_sdk="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' global.json)"
        test -n "${expected_sdk}"
        test "$(dotnet --version)" = "${expected_sdk}"
    - if: inputs.dotnet == 'true'
      name: Prepare and validate native compiler prerequisites
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS}" == Linux ]]; then
          packages=()
          command -v gcc >/dev/null || packages+=(gcc libc6-dev)
          command -v setfacl >/dev/null || packages+=(acl)
          if [[ ${#packages[@]} -ne 0 ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "${packages[@]}"
          fi
        fi
        bash eng/build-native.sh identify "$(dotnet --info | sed -nE 's/^ *RID: *(.*)/\1/p')" "${RUNNER_TEMP}/claimcore-native-toolchain.txt"
    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: web/package-lock.json
    # The setup action selects a version; this proves the runner is actually running it, including
    # the npm release, which no setup input pins.
    - if: inputs.node == 'true'
      name: Require the exact Node and npm toolchain
      shell: bash
      run: |
        set -euo pipefail
        test "$(node --version)" = "v$(tr -d '\r\n' < .node-version)"
        test "$(npm --version)" = "$(node -p "require('./web/package.json').engines.npm")"
