name: ClaimCore toolchain
description: >-
  Prepares the pinned .NET and Node toolchains. SDK-free frontend jobs use the pinned Node container.

inputs:
  dotnet:
    description: Set up the .NET SDK selected by global.json.
    required: false
    default: "true"
  node:
    description: Set up the Node release selected by .node-version and install the declared npm.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Telemetry, logo and color settings are identical for every job, so they live here and not in
    # each workflow. GitHub Actions already sets CI=true.
    - name: Disable telemetry, banners and color for every later step
      shell: bash
      run: |
        {
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
          echo "DOTNET_NOLOGO=1"
          echo "NO_COLOR=1"
          echo "TESTINGPLATFORM_TELEMETRY_OPTOUT=1"
        } >> "$GITHUB_ENV"
    - if: inputs.dotnet == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          src/**/packages.lock.json
          tests/**/packages.lock.json
          eng/**/packages.lock.json
    - if: inputs.dotnet == 'true'
      name: Require the exact .NET SDK
      shell: bash
      run: |
        set -euo pipefail
        expected_sdk="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' global.json)"
        test -n "${expected_sdk}"
        test "$(dotnet --version)" = "${expected_sdk}"
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - if: inputs.node == 'true'
      name: Cache npm downloads # zizmor: ignore[cache-poisoning] -- npm verifies lockfile integrity; no build outputs cached.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/claimcore-npm-cache
        key: npm-downloads-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
    # Node and npm have separate pins; install npm explicitly before checking both executables.
    - if: inputs.node == 'true'
      name: Install and verify the declared Node and npm toolchain
      shell: bash
      run: |
        set -euo pipefail
        test "$(node --version)" = "v$(tr -d '\r\n' < .node-version)"
        npm install --global --ignore-scripts "npm@$(node -p "require('./web/package.json').engines.npm")"
        test "$(npm --version)" = "$(node -p "require('./web/package.json').engines.npm")"
