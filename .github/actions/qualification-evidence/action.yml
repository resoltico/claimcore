name: Retain qualification evidence
description: Construct and upload only validated summaries, including failed test runs.
inputs:
  artifact-name:
    description: Unique public job and attempt identifier.
    required: true
runs:
  using: composite
  steps:
    - name: Prepare allowlisted qualification evidence
      id: evidence
      if: always()
      shell: bash
      run: python3 eng/verification_evidence.py publish artifacts/verification artifacts/qualification-upload
    - name: Retain sanitized qualification summaries
      if: always() && steps.evidence.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: artifacts/qualification-upload/*.json
        if-no-files-found: error
        retention-days: 14
