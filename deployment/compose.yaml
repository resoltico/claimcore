name: ${CLAIMCORE_COMPOSE_PROJECT:?Use the generated compose.env}

services:
  postgres:
    image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    environment:
      POSTGRES_DB: claimcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /etc/claimcore-postgres/superuser.password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/etc/claimcore-postgres/server.pem, -c, ssl_key_file=/etc/claimcore-postgres/server.key, -c, hba_file=/etc/claimcore-postgres-hba.conf]
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR:?}/postgres
        target: /etc/claimcore-postgres
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres-roles.sh
        target: /docker-entrypoint-initdb.d/10-claimcore-roles.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres-hba.conf
        target: /etc/claimcore-postgres-hba.conf
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    # The entrypoint starts a socket-only server while it initializes the database.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h /var/run/postgresql -U postgres -d claimcore &&
          test "$$(psql -XwAt -h /var/run/postgresql -U postgres -d claimcore
          -c "SELECT current_setting('listen_addresses') <> ''")" = t
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  identity:
    image: ${CLAIMCORE_COMPOSE_PROJECT}-identity
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: identity
    mem_limit: 2g
    pids_limit: 512
    command:
      - start
      - --db=dev-file
      - --health-enabled=true
      - --http-management-scheme=http
      - --http-management-host=127.0.0.1
      - --http-enabled=false
      - --https-port=${CLAIMCORE_IDENTITY_PORT:-5444}
      - --https-certificate-file=/etc/claimcore-identity/server.pem
      - --https-certificate-key-file=/etc/claimcore-identity/server.key
      - --hostname=https://identity.localhost:${CLAIMCORE_IDENTITY_PORT:-5444}
      - --import-realm
      - --spi-locale-selector--provider=claimcore-script
    networks:
      default:
        aliases: [identity.localhost]
    ports:
      - 127.0.0.1:${CLAIMCORE_IDENTITY_PORT:-5444}:${CLAIMCORE_IDENTITY_PORT:-5444}
    volumes:
      - identity-data:/opt/keycloak/data
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/identity
        target: /etc/claimcore-identity
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/identity/realm
        target: /opt/keycloak/data/import
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'HEAD /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r protocol status remainder <&3;
          [[ "$$protocol" == HTTP/1.* && "$$status" == 200 ]]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  administration:
    user: "${CLAIMCORE_UID:?}:${CLAIMCORE_GID:?}"
    image: ${CLAIMCORE_COMPOSE_PROJECT}-runtime
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: runtime
    command:
      - initialize
      - ${CLAIMCORE_BUSINESS_ZONE:?}
      - --skip-existing
      - --owner-issuer
      - https://identity.localhost:${CLAIMCORE_IDENTITY_PORT:?}/realms/claimcore
      - --owner-subject
      - ${CLAIMCORE_OWNER_SUBJECT:?}
      - --owner-name
      - ${CLAIMCORE_OWNER_NAME:?}
      - --owner-role
      - CASE_HANDLER
      - --owner-role
      - PAYMENT_RECORDER
      - --owner-role
      - DATA_STEWARD
    environment:
      CLAIMCORE_ADMIN_CONNECTION_FILE: /etc/claimcore/owner.connection
      CLAIMCORE_DATA_KEY_FILE: /run/claimcore/data.key
    volumes:
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/data.key
        target: /run/claimcore/data.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/administration
        target: /etc/claimcore
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    command: [serve]
    user: "${CLAIMCORE_UID:?}:${CLAIMCORE_GID:?}"
    image: ${CLAIMCORE_COMPOSE_PROJECT}-runtime
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: runtime
    env_file:
      - ${CLAIMCORE_CONFIG_DIR}/web.env
    ports:
      - 127.0.0.1:${CLAIMCORE_HOST_PORT:-5443}:5443
    volumes:
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/data.key
        target: /run/claimcore/data.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/web
        target: /etc/claimcore/runtime
        read_only: true
        bind:
          create_host_path: false
      - web-key-ring:/var/lib/claimcore/key-ring
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    depends_on:
      administration:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck:
      test: [CMD, dotnet, claimcore-server.dll, probe, ready]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres-data:
  identity-data:
  web-key-ring:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAIMCORE_CONFIG_DIR}/key-ring
