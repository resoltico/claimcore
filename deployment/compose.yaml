name: ${CLAIMCORE_COMPOSE_PROJECT:?Use the generated compose.env}

services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: claimcore
      POSTGRES_USER: claimcore_owner
      POSTGRES_PASSWORD_FILE: /etc/claimcore-postgres/owner.password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/etc/claimcore-postgres/server.pem, -c, ssl_key_file=/etc/claimcore-postgres/server.key]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${CLAIMCORE_CONFIG_DIR:?}/postgres:/etc/claimcore-postgres:ro
      - ./postgres-roles.sh:/docker-entrypoint-initdb.d/10-claimcore-roles.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, claimcore_owner, -d, claimcore]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command:
      - start
      - --db=dev-file
      - --health-enabled=true
      - --http-enabled=false
      - --https-port=${CLAIMCORE_IDENTITY_PORT:-5444}
      - --https-certificate-file=/etc/claimcore-identity/server.pem
      - --https-certificate-key-file=/etc/claimcore-identity/server.key
      - --hostname=https://identity.localhost:${CLAIMCORE_IDENTITY_PORT:-5444}
      - --import-realm
    networks:
      default:
        aliases: [identity.localhost]
    ports:
      - 127.0.0.1:${CLAIMCORE_IDENTITY_PORT:-5444}:${CLAIMCORE_IDENTITY_PORT:-5444}
    volumes:
      - identity-data:/opt/keycloak/data
      - ${CLAIMCORE_CONFIG_DIR}/identity:/etc/claimcore-identity:ro
      - ${CLAIMCORE_CONFIG_DIR}/identity/realm:/opt/keycloak/data/import:ro
    restart: unless-stopped

  administration:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: administration
    entrypoint: [/bin/sh, -c]
    command: ['dotnet /app/database/ClaimCore.Database.dll initialize "$$CLAIMCORE_BUSINESS_ZONE" && dotnet /app/database/ClaimCore.Database.dll provision-owner']
    environment:
      CLAIMCORE_BUSINESS_ZONE: ${CLAIMCORE_BUSINESS_ZONE:?}
      CLAIMCORE_ADMIN_CONNECTION_FILE: /etc/claimcore/owner.connection
      CLAIMCORE_INITIAL_OWNER_PRINCIPAL_FILE: /etc/claimcore/owner.principal
    volumes:
      - ${CLAIMCORE_CONFIG_DIR}/administration:/etc/claimcore:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: web
    env_file:
      - ${CLAIMCORE_CONFIG_DIR}/web.env
    ports:
      - 127.0.0.1:${CLAIMCORE_HOST_PORT:-5443}:5443
    volumes:
      - ${CLAIMCORE_CONFIG_DIR}/web:/etc/claimcore/runtime:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      administration:
        condition: service_completed_successfully
      identity:
        condition: service_started
    healthcheck:
      test: [CMD, dotnet, ClaimCore.Web.dll, probe, ready]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres-data:
  identity-data:
