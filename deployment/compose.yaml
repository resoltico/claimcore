name: ${CLAIMCORE_COMPOSE_PROJECT:?Use the generated compose.env}

services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: claimcore
      POSTGRES_USER: claimcore_owner
      POSTGRES_PASSWORD_FILE: /etc/claimcore-postgres/owner.password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/etc/claimcore-postgres/server.pem, -c, ssl_key_file=/etc/claimcore-postgres/server.key]
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR:?}/postgres
        target: /etc/claimcore-postgres
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres-roles.sh
        target: /docker-entrypoint-initdb.d/10-claimcore-roles.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, claimcore_owner, -d, claimcore]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.8.1-1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    mem_limit: 2g
    command:
      - start
      - --db=dev-file
      - --health-enabled=true
      - --http-management-scheme=http
      - --http-management-host=127.0.0.1
      - --http-enabled=false
      - --https-port=${CLAIMCORE_IDENTITY_PORT:-5444}
      - --https-certificate-file=/etc/claimcore-identity/server.pem
      - --https-certificate-key-file=/etc/claimcore-identity/server.key
      - --hostname=https://identity.localhost:${CLAIMCORE_IDENTITY_PORT:-5444}
      - --import-realm
    networks:
      default:
        aliases: [identity.localhost]
    ports:
      - 127.0.0.1:${CLAIMCORE_IDENTITY_PORT:-5444}:${CLAIMCORE_IDENTITY_PORT:-5444}
    volumes:
      - identity-data:/opt/keycloak/data
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/identity
        target: /etc/claimcore-identity
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/identity/realm
        target: /opt/keycloak/data/import
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'HEAD /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r protocol status remainder <&3;
          [[ "$$protocol" == HTTP/1.* && "$$status" == 200 ]]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  administration:
    user: "${CLAIMCORE_UID:?}:${CLAIMCORE_GID:?}"
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: administration
    entrypoint: [/bin/sh, -c]
    command: ['dotnet /app/database/ClaimCore.Database.dll initialize "$$CLAIMCORE_BUSINESS_ZONE" && dotnet /app/database/ClaimCore.Database.dll provision-owner']
    environment:
      CLAIMCORE_BUSINESS_ZONE: ${CLAIMCORE_BUSINESS_ZONE:?}
      CLAIMCORE_ADMIN_CONNECTION_FILE: /etc/claimcore/owner.connection
      CLAIMCORE_INITIAL_OWNER_PRINCIPAL_FILE: /etc/claimcore/owner.principal
    volumes:
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/administration
        target: /etc/claimcore
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    user: "${CLAIMCORE_UID:?}:${CLAIMCORE_GID:?}"
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: web
    env_file:
      - ${CLAIMCORE_CONFIG_DIR}/web.env
    ports:
      - 127.0.0.1:${CLAIMCORE_HOST_PORT:-5443}:5443
    volumes:
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR}/web
        target: /etc/claimcore/runtime
        read_only: true
        bind:
          create_host_path: false
      - web-key-ring:/var/lib/claimcore/key-ring
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      administration:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck:
      test: [CMD, dotnet, ClaimCore.Web.dll, probe, ready]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres-data:
  identity-data:
  web-key-ring:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAIMCORE_CONFIG_DIR}/key-ring
