name: claimcore

services:
  postgres:
    image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    environment:
      POSTGRES_DB: claimcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /etc/claimcore-postgres/superuser.password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/etc/claimcore-postgres/server.pem, -c, ssl_key_file=/etc/claimcore-postgres/server.key, -c, hba_file=/etc/claimcore-postgres-hba.conf]
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR:?}/postgres
        target: /etc/claimcore-postgres
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../postgres-roles.sh
        target: /docker-entrypoint-initdb.d/10-claimcore-roles.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../postgres-hba.conf
        target: /etc/claimcore-postgres-hba.conf
        read_only: true
        bind:
          create_host_path: false
    networks: [database]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    # The entrypoint starts a socket-only server while it initializes the database.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h /var/run/postgresql -U postgres -d claimcore &&
          test "$$(psql -XwAt -h /var/run/postgresql -U postgres -d claimcore
          -c "SELECT current_setting('listen_addresses') <> ''")" = t
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  administration:
    profiles: [administration]
    image: ghcr.io/resoltico/claimcore-server@sha256:${CLAIMCORE_SERVER_SHA256:?}
    command: [status]
    user: "${CLAIMCORE_UID:?}:${CLAIMCORE_GID:?}"
    environment:
      CLAIMCORE_ADMIN_CONNECTION_FILE: /etc/claimcore/administration/owner.connection
      CLAIMCORE_DATA_KEY_FILE: /run/claimcore/data.key
    volumes:
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR:?}/data.key
        target: /run/claimcore/data.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR:?}/administration
        target: /etc/claimcore/administration
        read_only: true
        bind:
          create_host_path: false
    networks: [database]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ghcr.io/resoltico/claimcore-server@sha256:${CLAIMCORE_SERVER_SHA256:?}
    command: [serve]
    user: "${CLAIMCORE_UID:?}:${CLAIMCORE_GID:?}"
    environment:
      CLAIMCORE_CONNECTION_FILE: /etc/claimcore/runtime/runtime.connection
      CLAIMCORE_DATA_KEY_FILE: /run/claimcore/data.key
      CLAIMCORE_WEB_CERTIFICATE_PATH: /etc/claimcore/runtime/server.pfx
      CLAIMCORE_WEB_KEY_RING_DIRECTORY: /var/lib/claimcore/key-ring
      CLAIMCORE_WEB_ORIGIN: ${CLAIMCORE_WEB_ORIGIN:?}
      CLAIMCORE_WEB_LISTEN_ADDRESS: 0.0.0.0
      CLAIMCORE_WEB_LISTEN_PORT: "5443"
      CLAIMCORE_OIDC_ISSUER: ${CLAIMCORE_OIDC_ISSUER:?}
      CLAIMCORE_OIDC_CLIENT_ID: ${CLAIMCORE_OIDC_CLIENT_ID:?}
      CLAIMCORE_OIDC_CLIENT_SECRET_FILE: /etc/claimcore/runtime/client.secret
      CLAIMCORE_OIDC_API_AUDIENCE: ${CLAIMCORE_OIDC_API_AUDIENCE:?}
      CLAIMCORE_OIDC_CLI_CLIENT_ID: ${CLAIMCORE_OIDC_CLI_CLIENT_ID:?}
    ports:
      - target: 5443
        published: "${CLAIMCORE_HOST_PORT:-443}"
        host_ip: ${CLAIMCORE_BIND_ADDRESS:-0.0.0.0}
    volumes:
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR:?}/data.key
        target: /run/claimcore/data.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLAIMCORE_CONFIG_DIR:?}/web
        target: /etc/claimcore/runtime
        read_only: true
        bind:
          create_host_path: false
      - web-key-ring:/var/lib/claimcore/key-ring
    networks: [default, database]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, dotnet, claimcore-server.dll, probe, ready]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 45s
    restart: unless-stopped

networks:
  database:
    internal: true

volumes:
  postgres-data:
  web-key-ring:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAIMCORE_CONFIG_DIR:?}/key-ring
