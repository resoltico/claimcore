# ClaimCore PostgreSQL access rules (S2). First match wins.
# Local socket: entrypoint, init script and healthcheck inside the container only.
local   all        all                                           trust
# Network: TLS only, ClaimCore roles only, ClaimCore database only.
hostssl claimcore  claimcore_owner,claimcore_runtime  all        scram-sha-256
# Everything else over the network, with or without TLS, including the postgres superuser.
host    all        all                                all        reject
