name: ${CLAIMCORE_COMPOSE_PROJECT:-claimcore}
services:
  postgres:
    image: ghcr.io/resoltico/claimcore-postgres:18.6-trixie-p2-r34736975281-1@sha256:ae84d4fd380ade930b6246340a39e2448786f5bcaad258ee1f2e62807a5f8c45
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: claimcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose environment}
      CLAIMCORE_APP_PASSWORD: ${CLAIMCORE_APP_PASSWORD:?Set CLAIMCORE_APP_PASSWORD in the Compose environment}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${CLAIMCORE_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/dev-init.sh:/docker-entrypoint-initdb.d/10-claimcore.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=$$CLAIMCORE_APP_PASSWORD psql --host=127.0.0.1
          --username=claimcore_app --dbname=claimcore --no-psqlrc
          --tuples-only --no-align --command='SELECT 1' | grep -qx 1
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
volumes:
  postgres-data:
